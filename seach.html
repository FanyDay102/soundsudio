<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audius 歌曲搜索 · 试听 · 提取链接 · 下载</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --border: rgba(255,255,255,0.08);
    --text: #f1f5f9; --sub: #94a3b8; --primary: #6366f1;
    --green: #10b981; --amber: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  .container { width: 100%; max-width: 780px; padding: 32px 20px 120px; }

  h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: var(--sub); margin-bottom: 24px; line-height: 1.6; }
  .subtitle a { color: var(--primary); text-decoration: none; }

  /* 搜索栏 */
  .search-box { display: flex; gap: 10px; margin-bottom: 24px; }
  .search-box input {
    flex: 1; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 15px; outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--primary); }
  .search-box button {
    padding: 0 24px; border-radius: 12px; border: none; background: var(--primary);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s;
    white-space: nowrap;
  }
  .search-box button:hover { filter: brightness(1.1); }
  .search-box button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* 状态提示 */
  .status { font-size: 13px; color: var(--sub); text-align: center; padding: 40px 0; }
  .status.error { color: #f87171; }

  /* 结果列表 */
  .results { display: flex; flex-direction: column; gap: 10px; }
  .track {
    display: flex; align-items: center; gap: 14px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 14px; transition: border-color 0.2s;
  }
  .track:hover { border-color: rgba(255,255,255,0.2); }
  .track.playing { border-color: var(--primary); background: rgba(99,102,241,0.08); }

  .cover {
    width: 56px; height: 56px; border-radius: 10px; object-fit: cover;
    flex-shrink: 0; background: #334155;
  }
  .info { flex: 1; min-width: 0; }
  .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 12px; color: var(--sub); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 11px; color: #64748b; margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge { padding: 1px 7px; border-radius: 4px; font-size: 10px; font-weight: 500; }
  .badge.dl { background: rgba(16,185,129,0.15); color: var(--green); }
  .badge.stream { background: rgba(245,158,11,0.12); color: var(--amber); }

  .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-icon {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.06); color: var(--text); font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: 0.2s;
  }
  .btn-icon:hover { background: rgba(255,255,255,0.15); }
  .btn-icon:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-icon.play { background: var(--primary); color: #fff; }
  .btn-icon.play:hover { filter: brightness(1.1); }

  /* 底部播放器 */
  .player-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(15,23,42,0.92); backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; gap: 16px;
    z-index: 100;
  }
  .player-bar audio { flex: 1; height: 40px; outline: none; }
  .now-playing { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  @media (max-width: 600px) {
    .now-playing { display: none; }
    .search-box { flex-direction: column; }
    .search-box button { padding: 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎧 Audius 音乐搜索</h1>
  <p class="subtitle">
    搜索 Audius 开放曲库，在线试听，复制流媒体直链，或下载可下载的曲目。
    <br>数据源：<a href="https://audius.co" target="_blank">audius.co</a>（去中心化独立音乐平台）。
  </p>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="输入歌曲名、艺术家或关键词..." autofocus>
    <button id="searchBtn">搜索</button>
  </div>

  <div id="status" class="status">输入关键词开始搜索。</div>
  <div id="results" class="results"></div>
</div>

<!-- 底部播放器 -->
<div class="player-bar">
  <div class="now-playing" id="nowPlaying">未播放</div>
  <audio id="audio" controls preload="none"></audio>
</div>

<script>
/* =========================================================
   Audius 搜索工具
   - 使用 discoveryprovider.audius.co 公开端点
   - 流媒体 URL 格式：/v1/tracks/{id}/stream?app_name=...
   ========================================================= */

const DISCOVERY = 'https://discoveryprovider.audius.co';
const APP_NAME = 'HTMLMusicSearchTool';
const AUDIO = document.getElementById('audio');
const NOW_PLAYING = document.getElementById('nowPlaying');
const STATUS = document.getElementById('status');
const RESULTS = document.getElementById('results');

let currentTrackId = null;

/* ---------- 搜索 ---------- */
async function search(query) {
  if (!query.trim()) return;
  STATUS.className = 'status';
  STATUS.textContent = '搜索中...';
  RESULTS.innerHTML = '';
  document.getElementById('searchBtn').disabled = true;

  try {
    const url = `${DISCOVERY}/v1/tracks/search?query=${encodeURIComponent(query)}&app_name=${APP_NAME}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    const tracks = json.data || [];

    if (tracks.length === 0) {
      STATUS.textContent = '没有找到相关曲目，换个关键词试试。';
      return;
    }
    renderTracks(tracks);
    STATUS.textContent = `找到 ${tracks.length} 首曲目。`;
  } catch (e) {
    console.error(e);
    STATUS.className = 'status error';
    STATUS.textContent = `搜索失败：${e.message}。可能是网络或 CORS 限制，请稍后重试。`;
  } finally {
    document.getElementById('searchBtn').disabled = false;
  }
}

/* ---------- 渲染结果 ---------- */
function renderTracks(tracks) {
  RESULTS.innerHTML = tracks.map(t => {
    const id = t.id;
    const title = escapeHtml(t.title || '无标题');
    const artist = escapeHtml(t.user?.name || '未知艺术家');
    const cover = t.artwork?.['150x150'] || t.artwork?.['480x480'] || '';
    const duration = formatDuration(t.duration);
    const downloadable = t.downloadable === true;

    const badge = downloadable
      ? '<span class="badge dl">可下载</span>'
      : '<span class="badge stream">仅流媒体</span>';

    return `
      <div class="track" data-id="${id}">
        <img class="cover" src="${cover}" alt="" loading="lazy" onerror="this.style.opacity='0.2'">
        <div class="info">
          <div class="title">${title}</div>
          <div class="artist">${artist}</div>
          <div class="meta">${duration} ${badge}</div>
        </div>
        <div class="actions">
          <button class="btn-icon play" title="试听" data-action="play" data-id="${id}">▶</button>
          <button class="btn-icon" title="复制流媒体链接" data-action="copy" data-id="${id}">🔗</button>
          <button class="btn-icon" title="下载音频" data-action="download" data-id="${id}" ${downloadable ? '' : 'disabled'}>⬇</button>
        </div>
      </div>
    `;
  }).join('');

  // 绑定事件
  RESULTS.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', handleAction);
  });
}

/* ---------- 操作处理 ---------- */
async function handleAction(e) {
  const btn = e.currentTarget;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  const trackEl = btn.closest('.track');

  if (action === 'play') {
    playTrack(id, trackEl);
  } else if (action === 'copy') {
    await copyStreamLink(id, btn);
  } else if (action === 'download') {
    await downloadTrack(id, btn);
  }
}

/* ---------- 播放 ---------- */
function playTrack(id, trackEl) {
  const streamUrl = `${DISCOVERY}/v1/tracks/${id}/stream?app_name=${APP_NAME}`;
  AUDIO.src = streamUrl;
  AUDIO.play().catch(err => {
    console.warn('播放被拦截或失败', err);
    STATUS.className = 'status error';
    STATUS.textContent = '播放失败，可能是浏览器自动播放限制或音频不可用。';
  });

  document.querySelectorAll('.track').forEach(el => el.classList.remove('playing'));
  if (trackEl) trackEl.classList.add('playing');

  const title = trackEl?.querySelector('.title')?.textContent || '未知曲目';
  const artist = trackEl?.querySelector('.artist')?.textContent || '';
  NOW_PLAYING.textContent = `${title} — ${artist}`;
  currentTrackId = id;
}

/* ---------- 复制链接 ---------- */
async function copyStreamLink(id, btn) {
  const streamUrl = `${DISCOVERY}/v1/tracks/${id}/stream?app_name=${APP_NAME}`;
  try {
    await navigator.clipboard.writeText(streamUrl);
    btn.textContent = '✓';
    btn.style.color = 'var(--green)';
    setTimeout(() => { btn.textContent = '🔗'; btn.style.color = ''; }, 1500);
  } catch {
    prompt('手动复制流媒体链接：', streamUrl);
  }
}

/* ---------- 下载 ---------- */
async function downloadTrack(id, btn) {
  const streamUrl = `${DISCOVERY}/v1/tracks/${id}/stream?app_name=${APP_NAME}`;
  btn.disabled = true;
  btn.textContent = '⏳';
  try {
    const res = await fetch(streamUrl);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `audius-${id}.mp3`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    btn.textContent = '✓';
    btn.style.color = 'var(--green)';
  } catch (e) {
    console.error(e);
    btn.textContent = '✗';
    alert(`下载失败：${e.message}。\n\n你可以尝试：\n1. 点击 🔗 复制链接，在浏览器新标签页中打开后右键保存。\n2. 如果网络环境受限，可能需要代理。`);
  } finally {
    btn.disabled = false;
    setTimeout(() => { btn.textContent = '⬇'; btn.style.color = ''; }, 2000);
  }
}

/* ---------- 工具函数 ---------- */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
}
function formatDuration(sec) {
  if (!sec || !isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

/* ---------- 初始化 ---------- */
document.getElementById('searchBtn').addEventListener('click', () => {
  search(document.getElementById('searchInput').value);
});
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') search(e.target.value);
});
</script>
</body>
</html>
