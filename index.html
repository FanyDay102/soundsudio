<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>沉浸式音乐播放器</title>
<style>
  :root {
    --primary: #ef4444;
    --primary-dark: #dc2626;
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
    --bg-color: #0f172a;
    --glass-bg: rgba(30, 41, 59, 0.65);
    --glass-border: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
  }

  .main-container {
    width: 100%;
    max-width: 1050px;
    height: 100%;
    max-height: 900px;
    display: flex;
    gap: 0;
    position: relative;
    overflow: hidden;
  }

  .bg-blur {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-size: cover;
    background-position: center;
    filter: blur(40px) brightness(0.4);
    z-index: -1;
    transform: scale(1.2);
    transition: background-image 0.5s;
  }

  .player-page {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 24px 40px;
    position: relative;
    z-index: 10;
    height: 100%;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: transform 0.3s ease-in-out;
  }

  .player-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 48px;
    margin-bottom: 20px;
  }
  .nav-icon {
    color: var(--text-main);
    font-size: 20px;
    cursor: pointer;
    opacity: 0.85;
    width: 40px; height: 40px;
    display: flex; justify-content: center; align-items: center;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    touch-action: manipulation;
    transition: background 0.2s, opacity 0.2s, transform 0.1s;
  }
  .nav-icon:hover { background: rgba(255,255,255,0.15); opacity: 1; }
  .nav-icon:active { transform: scale(0.92); background: rgba(255,255,255,0.2); }

  .nav-tools { display: flex; gap: 8px; align-items: center; }
  .url-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 6px 16px;
    border-radius: 20px;
    color: var(--text-main);
    text-decoration: none;
    font-size: 13px;
    transition: all 0.2s;
    cursor: pointer;
    font-family: inherit;
    line-height: 1;
    white-space: nowrap;
  }
  .url-btn:hover { background: rgba(255,255,255,0.2); }

  .cover-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    width: 100%;
    min-height: 0;
  }

  .cover-img {
    width: 280px;
    height: 280px;
    border-radius: 24px;
    object-fit: cover;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2;
    flex-shrink: 0;
  }
  
  .cover-img.lyrics-mode {
    transform: translateY(-120%) scale(0.6);
    opacity: 0;
    pointer-events: none;
  }
  
  .lyrics-container {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: auto;
    text-align: center;
    padding: 35% 20px;
    mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
    scroll-behavior: smooth;
    z-index: 3;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease 0.2s;
  }
  .lyrics-container::-webkit-scrollbar { display: none; }
  .lyrics-container.active { opacity: 1; pointer-events: auto; }
  
  .lyric-line {
    font-size: 16px;
    color: rgba(255,255,255,0.4);
    line-height: 2.2;
    transition: all 0.3s;
    cursor: pointer;
    padding: 4px 0;
    transform-origin: center;
  }
  .lyric-line:hover { color: rgba(255,255,255,0.8); }
  .lyric-line.active {
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    transform: scale(1.05);
    text-shadow: 0 2px 10px rgba(255,255,255,0.3);
  }
  .no-lyrics { font-size: 14px; color: var(--text-sub); margin-top: 20px; }

  .song-meta { 
    text-align: center; 
    margin-top: 20px; 
    padding: 0 10px; 
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .song-meta.lyrics-mode {
    transform: translateY(-200px); 
    opacity: 0;
    pointer-events: none;
  }

  .song-title-lg {
    font-size: 24px; 
    font-weight: 700; 
    margin-bottom: 8px;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: break-all;
  }
  .song-artist-lg { 
    font-size: 14px; 
    color: var(--text-sub); 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis;
  }

  .progress-area { margin-top: 20px; width: 100%; flex-shrink: 0; }
  .time-wrap {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--text-sub);
    margin-bottom: 10px; font-variant-numeric: tabular-nums;
  }
  input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%;
    background: #fff; margin-top: -4px; box-shadow: 0 0 10px rgba(255,255,255,0.5); transition: transform 0.1s;
  }
  input[type=range]:active::-webkit-slider-thumb { transform: scale(1.3); }
  #progress::-webkit-slider-runnable-track { background: linear-gradient(to right, #fff var(--p,0%), rgba(255,255,255,0.15) var(--p,0%)); }

  .controls {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 20px; margin-bottom: 10px; padding: 0 10px;
    flex-shrink: 0;
  }
  .btn-icon {
    background: none; border: none; color: rgba(255,255,255,0.6); font-size: 22px;
    cursor: pointer; transition: 0.2s; width: 44px; height: 44px;
    border-radius: 50%; display: flex; justify-content: center; align-items: center;
  }
  .btn-icon:hover { color: #fff; background: rgba(255,255,255,0.1); }
  .btn-icon.active { color: var(--primary); }
  
  .btn-icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  
  .btn-play-main {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--primary); border: none; color: #fff; font-size: 28px;
    display: flex; justify-content: center; align-items: center; cursor: pointer;
    box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
    transition: transform 0.1s, background 0.2s;
  }
  .btn-play-main:hover { background: var(--primary-dark); transform: scale(1.05); }
  .btn-play-main:active { transform: scale(0.95); }
  .btn-play-main svg { width: 32px; height: 32px; fill: currentColor; }

  .hide { display: none !important; }

  .list-page {
    flex: 0 0 400px;
    min-width: 400px;
    background: var(--glass-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-left: 1px solid var(--glass-border);
    display: flex; flex-direction: column; height: 100%; z-index: 20;
    transition: transform 0.3s ease-in-out;
    position: relative;
  }

  .list-header { padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .header-top { display: flex; justify-content: flex-start; align-items: center; margin-bottom: 16px; }
  
  .mobile-back-btn { display: none; }

  .header-top h2 { font-size: 18px; font-weight: 600; }
  .header-top span { font-size: 13px; color: var(--text-sub); font-weight: 400; }

  .tag-manager { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .tag-select {
    padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.2); color: #fff; outline: none; font-size: 13px; cursor: pointer;
  }
  .tag-select option { background: #1e293b; color: #fff; }

  .song-search-input {
    flex: 1;
    min-width: 130px;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.2);
    color: #fff;
    outline: none;
    font-size: 13px;
    transition: 0.2s;
    font-family: inherit;
  }
  .song-search-input::placeholder { color: rgba(255,255,255,0.4); }
  .song-search-input:focus { border-color: var(--primary); }

  .tag-input-wrap { display: flex; gap: 6px; margin-left: auto; }
  .tag-input {
    padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.2); color: #fff; outline: none; font-size: 12px; width: 90px;
  }
  .tag-input:focus { border-color: var(--primary); }
  .btn-add-tag {
    padding: 6px 12px; border-radius: 8px; border: none;
    background: var(--primary); color: white; font-size: 12px; cursor: pointer; transition: 0.2s;
  }
  .btn-add-tag:hover { background: var(--primary-dark); }

  .playlist { list-style: none; overflow-y: auto; flex: 1; padding: 12px; }
  .playlist::-webkit-scrollbar { width: 4px; }
  .playlist::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

  .track-item {
    display: flex; align-items: center; gap: 14px; padding: 10px 12px;
    border-radius: 12px; cursor: pointer; transition: background 0.2s; margin-bottom: 4px;
  }
  .track-item:hover { background: rgba(255,255,255,0.05); }
  .track-item.active { background: rgba(239, 68, 68, 0.15); }
  .track-item.active .track-name { color: var(--primary); font-weight: 700; }
  .track-item.dragging { opacity: 0.5; background: rgba(255,255,255,0.1); }
  .track-item.drag-over { border-top: 2px solid var(--primary); }

  .track-icon { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #1e293b; flex-shrink: 0; }
  .track-info { flex: 1; min-width: 0; }
  .track-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-path { font-size: 11px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-path.local { color: #93c5fd; }
  .song-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .mini-tag { font-size: 10px; background: rgba(239,68,68,0.2); color: #fca5a5; padding: 2px 6px; border-radius: 4px; }

  .playing-indicator { display: none; gap: 3px; align-items: flex-end; height: 12px; margin-right: 4px; }
  .track-item.active .playing-indicator { display: flex; }
  .playing-indicator i { display: block; width: 2px; background: var(--primary); border-radius: 1px; animation: eq 1s infinite ease-in-out; }
  .playing-indicator i:nth-child(1) { height: 60%; animation-delay: 0s; }
  .playing-indicator i:nth-child(2) { height: 100%; animation-delay: -0.2s; }
  .playing-indicator i:nth-child(3) { height: 40%; animation-delay: -0.4s; }
  @keyframes eq { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }

  .btn-more { background: none; border: none; font-size: 20px; color: var(--text-sub); cursor: pointer; padding: 0 6px; line-height: 1; transition: 0.2s; }
  .btn-more:hover { color: #fff; }

  .context-menu {
    position: fixed; background: #1e293b; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); padding: 8px;
    min-width: 160px; z-index: 1000; display: none;
  }
  .menu-item { padding: 10px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: #e2e8f0; }
  .menu-item:hover { background: rgba(255,255,255,0.1); }
  .menu-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 6px 0; }
  .menu-title { font-size: 11px; color: var(--text-sub); padding: 4px 12px; }
  .menu-tag-label { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; border-radius: 6px; }
  .menu-tag-label:hover { background: rgba(255,255,255,0.1); }
  .menu-tag-label input { accent-color: var(--primary); }

  .floating-lyrics {
    position: fixed; top: 20%; left: 20%;
    background: rgba(15, 23, 42, 0.85); color: #fff;
    padding: 15px 20px; border-radius: 16px;
    font-size: 20px; font-weight: bold; text-align: center;
    backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 9999;
    cursor: grab; touch-action: none;
    min-width: 200px; min-height: 60px;
    display: none; flex-direction: column; justify-content: center; align-items: center;
    resize: both; overflow: auto;
  }
  .floating-lyrics:active { cursor: grabbing; }
  .float-close { position: absolute; top: 5px; right: 5px; font-size: 14px; color: #aaa; cursor: pointer; }
  .float-close:hover { color: #fff; }
  .float-text { pointer-events: none; padding: 10px; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }

  /* ================= 移动端适配 ================= */
  @media (max-width: 768px) {
    body { padding: 0; align-items: flex-start; }
    .main-container { flex-direction: column; height: 100dvh; overflow: hidden; }
    
    .player-page { 
      padding: 20px; 
      padding-top: 10px; 
      flex: none;
      width: 100vw;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      background: transparent; 
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
    }
    .player-nav { margin-bottom: 10px; }
    .cover-area { flex: 1; min-height: 300px; justify-content: flex-start; padding-top: 20px; }
    
    .cover-img { width: 220px; height: 220px; border-radius: 16px; }
    .lyrics-container { padding: 45% 20px; }
    .lyric-line { font-size: 15px; line-height: 2; }
    .lyric-line.active { font-size: 18px; }

    .song-meta { margin-top: 15px; }
    .song-title-lg { font-size: 20px; -webkit-line-clamp: 1; }
    .progress-area { margin-top: 20px; }
    .controls { margin-top: 15px; margin-bottom: 10px; }
    .btn-play-main { width: 56px; height: 56px; font-size: 24px; }

    /* 手机端列表页：全屏滑入 */
    .list-page { 
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100%;
      min-width: 100%;
      flex: none;
      background: var(--bg-color);
      border-left: none;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
    }

    /* 滑入状态 */
    .main-container.show-list .player-page {
      transform: translateX(-20%);
    }
    .main-container.show-list .list-page {
      transform: translateX(0);
    }

    /* 返回按钮显示 */
    .mobile-back-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      cursor: pointer;
      margin-right: 12px;
      color: var(--text-main);
      flex-shrink: 0;
      touch-action: manipulation;
      transition: background 0.2s, transform 0.1s;
    }
    .mobile-back-btn:hover { background: rgba(255,255,255,0.18); }
    .mobile-back-btn:active { transform: scale(0.92); }
    .mobile-back-btn svg {
      width: 20px; height: 20px;
      fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .header-top { justify-content: flex-start; }
    .header-top h2 { font-size: 18px; }
    
    .list-header { padding: 20px; }
    .tag-manager { margin-top: 10px; }
    .tag-input-wrap { margin-left: 0; }
  }

  /* 齿轮按钮 */
  .gear-btn {
    margin-left: auto;
    width: 34px; height: 34px;
    display: flex; justify-content: center; align-items: center;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.25s;
    flex-shrink: 0;
    padding: 0;
    font-size: 15px;
    line-height: 1;
  }
  .gear-btn:hover { background: rgba(255,255,255,0.16); transform: rotate(45deg); }
  .gear-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .gear-btn:active { transform: rotate(45deg) scale(0.92); }

  #cancelSelectionBtn:hover,
  #cancelSelectionBtn:active { transform: none; }
  #cancelSelectionBtn:hover { background: rgba(255,255,255,0.16); }
  #cancelSelectionBtn:active { transform: scale(0.92); }

  .selection-count { display: none; font-size: 13px; font-weight: 600; color: var(--primary); margin-left: 10px; white-space: nowrap; }
  .list-page.selection-mode .selection-count { display: inline-block; }
  #cancelSelectionBtn { display: none; }
  .list-page.selection-mode #cancelSelectionBtn { display: flex; }
  .list-page.selection-mode #settingsBtn { display: none; }
  .list-page.selection-mode .tag-manager { display: none; }
  .list-page.selection-mode .btn-more { display: none; }

  .settings-panel {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
    flex-direction: column;
    background: rgba(15, 23, 42, 0.97);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
  }
  .settings-panel.open { transform: translateX(0); }

  .settings-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  .settings-header h3 { font-size: 16px; font-weight: 600; }
  .settings-close {
    width: 32px; height: 32px; border-radius: 50%;
    border: none; background: rgba(255,255,255,0.08);
    color: var(--text-main); cursor: pointer; font-size: 14px;
    display: flex; justify-content: center; align-items: center;
    transition: 0.2s;
  }
  .settings-close:hover { background: rgba(255,255,255,0.18); }

  .settings-body {
    flex: 1; overflow-y: auto;
    padding: 14px 16px 24px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .settings-body::-webkit-scrollbar { width: 4px; }
  .settings-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

  .setting-item {
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 14px 16px;
    border-radius: 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    color: var(--text-main);
    cursor: pointer; text-align: left;
    transition: all 0.2s;
  }
  .setting-item:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.15); transform: translateY(-1px); }
  .setting-item:active { transform: scale(0.99); }
  .setting-item .si-icon {
    width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
    display: flex; justify-content: center; align-items: center;
    background: rgba(239,68,68,0.15); color: #fca5a5;
  }
  .setting-item .si-icon svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .setting-item .si-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .setting-item .si-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .setting-item .si-desc { font-size: 11.5px; color: var(--text-sub); line-height: 1.45; word-break: break-all; }
  .setting-item .si-arrow { color: var(--text-sub); font-size: 18px; flex-shrink: 0; }

  .track-item.selectable { gap: 10px; }
  .track-check {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.3);
    display: flex; justify-content: center; align-items: center;
    transition: all 0.15s;
  }
  .track-item.selected .track-check {
    background: var(--primary);
    border-color: var(--primary);
    box-shadow: 0 0 10px rgba(239,68,68,0.5);
  }
  .track-item.selected .track-check::after {
    content: '';
    width: 5px; height: 9px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .track-item.selected { background: rgba(239,68,68,0.16); }

  .batch-bar {
    display: none;
    padding: 12px 16px;

/* =========================================================

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================
   ★ 视图切换：三条杠 → 列表页 / 返回按钮 → 播放页

/* =========================================================
   IndexedDB：缓存目录 Handle 持久化
   ========================================================= */
const FS_DB = 'mp_fs_v1';
const FS_STORE = 'handles';
let cacheDirHandle = null;

function fsOpenDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(FS_DB, 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(FS_STORE)) {
        req.result.createObjectStore(FS_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function fsSetHandle(handle) {
  const db = await fsOpenDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(FS_STORE, 'readwrite');
    if (handle) tx.objectStore(FS_STORE).put(handle, 'cacheDir');
    else tx.objectStore(FS_STORE).delete('cacheDir');
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function fsGetHandle() {
  const db = await fsOpenDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(FS_STORE, 'readonly');
    const req = tx.objectStore(FS_STORE).get('cacheDir');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function updateCacheDirUI() {
  const title = document.getElementById('cacheDirTitle');
  const desc = document.getElementById('cacheDirDesc');
  const clearItem = document.getElementById('clearCacheDirItem');
  if (!title || !desc || !clearItem) return;

  if (cacheDirHandle) {
    title.textContent = '缓存目录：' + cacheDirHandle.name;
    desc.textContent = '缓存歌曲时会自动写入该目录（首次写入需授权）';
    clearItem.style.display = '';
  } else {
    title.textContent = '设置缓存目录';
    desc.textContent = '未设置（缓存将下载到浏览器默认下载目录）';
    clearItem.style.display = 'none';
  }
}

async function restoreCacheDirHandle() {
  try {
    const handle = await fsGetHandle();
    if (handle) {
      cacheDirHandle = handle;
      updateCacheDirUI();
    }
  } catch (e) {
    console.warn('恢复缓存目录失败', e);
  }
}

async function ensureDirPermission() {
  if (!cacheDirHandle) return false;
  try {
    let perm = await cacheDirHandle.queryPermission({ mode: 'readwrite' });
    if (perm === 'granted') return true;
    perm = await cacheDirHandle.requestPermission({ mode: 'readwrite' });
    return perm === 'granted';
  } catch (e) {
    return false;
  }
}

async function writeBlobToDir(filename, blob) {
  if (!cacheDirHandle) return false;
  if (!(await ensureDirPermission())) return false;
  try {
    const fileHandle = await cacheDirHandle.getFileHandle(filename, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(blob);
    await writable.close();
    return true;
  } catch (e) {
    console.warn('写入目录失败', e);
    return false;
  }
}

async function pickCacheDir() {
  if (!('showDirectoryPicker' in window)) {
    alert('当前浏览器不支持目录选择功能。\n需要 Chrome / Edge 等桌面版浏览器。\n缓存歌曲将使用浏览器默认下载方式。');
    return;
  }
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    cacheDirHandle = handle;
    await fsSetHandle(handle);
    updateCacheDirUI();
  } catch (e) {
    if (e.name === 'AbortError') return;
    console.error('选择目录失败', e);
    alert('选择目录失败：' + (e.message || e.name));
  }
}

async function clearCacheDir() {
  try {
    await fsSetHandle(null);
    cacheDirHandle = null;
    updateCacheDirUI();
  } catch (e) {
    console.error(e);
  }
}

/* =========================================================
   本地文件
   ========================================================= */
function openLocalFilePicker() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'audio/*,.mp3,.m4a,.wav,.flac,.ogg,.aac,.opus';
  input.multiple = true;
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', () => {
    if (input.files && input.files.length > 0) {
      addLocalFiles(input.files);
    }
    setTimeout(() => { if (input.parentNode) document.body.removeChild(input); }, 0);
  });
  input.click();
}

function addLocalFiles(fileList) {
  let added = 0;
  const files = Array.from(fileList);

  for (const file of files) {
    const isAudio = file.type.startsWith('audio/') ||
      /\.(mp3|m4a|wav|flac|ogg|aac|opus)$/i.test(file.name);
    if (!isAudio) continue;

    const displayName = file.name.replace(/\.[^.]+$/, '');
    const localPath = `local:${file.name}:${file.size}:${file.lastModified}`;

    const existing = allSongs.find(s => s.path === localPath);
    if (existing) {
      if (existing.blobUrl) URL.revokeObjectURL(existing.blobUrl);
      const blobUrl = URL.createObjectURL(file);
      existing.blobUrl = blobUrl;
      existing.url = blobUrl;
      existing.file = file;
      continue;
    }

    const blobUrl = URL.createObjectURL(file);
    allSongs.unshift({
      name: displayName,
      path: localPath,
      url: blobUrl,
      blobUrl: blobUrl,
      file: file,
      isLocal: true
    });
    added++;
  }

  if (added > 0) {
    renderPlaylist();
    updateTagSelect();
    openListView();
    setTimeout(() => {
      alert(`已添加 ${added} 个本地文件到播放列表`);
    }, 50);
  } else {
    alert('未添加任何文件（可能已存在或不是音频格式）');
  }
}

/* =========================================================
   核心：获取歌词
   ========================================================= */
async function fetchLyrics(songName) {
  mainCover.classList.remove('lyrics-mode');
  songMeta.classList.remove('lyrics-mode');
  lyricsContainer.classList.remove('active');
  currentLyrics = [];
  activeLyricIndex = -1;

  let title = songName;
  let artist = '';
  if (songName.includes(' - ')) {
    const parts = songName.split(' - ');
    artist = parts[0].trim();
    title = parts[1].trim();
  }

  try {
    let apiUrl = `https://lrclib.net/api/get?track_name=${encodeURIComponent(title)}`;
    if (artist) apiUrl += `&artist_name=${encodeURIComponent(artist)}`;
    
    let res = await fetch(apiUrl, { headers: { 'Lrclib-Client': 'MyHTMLMusicPlayer v1.0' } });

    if (res.status === 404) {
      const query = artist ? `${title} ${artist}` : title;
      apiUrl = `https://lrclib.net/api/search?q=${encodeURIComponent(query)}`;
      res = await fetch(apiUrl, { headers: { 'Lrclib-Client': 'MyHTMLMusicPlayer v1.0' } });
    }

    if (!res.ok) throw new Error('未找到歌词');

    const data = await res.json();
    const result = Array.isArray(data) ? data[0] : data;

    if (!result || !result.syncedLyrics) {
      lyricsContainer.innerHTML = '<div class="no-lyrics">纯音乐 / 暂无同步歌词</div>';
      return;
    }

    parseLRC(result.syncedLyrics);
    if (result.artistName) songArtist.textContent = result.artistName;

    if (currentLyrics.length > 0) {
      mainCover.classList.add('lyrics-mode');
      songMeta.classList.add('lyrics-mode');
      lyricsContainer.classList.add('active');
    }
  } catch (error) {
    console.warn('歌词获取失败:', error);
    lyricsContainer.innerHTML = '<div class="no-lyrics">暂无歌词</div>';
  }
}

function parseLRC(lrcText) {
  const lines = lrcText.split('\n');
  const result = [];
  const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;

  lines.forEach(line => {
    const match = line.match(timeReg);
    if (match) {
      const min = parseInt(match[1]);
      const sec = parseInt(match[2]);
      const ms = parseInt(match[3].padEnd(3, '0'));
      const time = min * 60 + sec + ms / 1000;
      const text = match[4].trim();
      if (text) result.push({ time, text });
    }
  });

  currentLyrics = result;
  if (currentLyrics.length === 0) return;

  lyricsContainer.innerHTML = currentLyrics.map((lyric, index) => `
    <div class="lyric-line" data-index="${index}" onclick="seekToLyric(${lyric.time})">${escapeHtml(lyric.text)}</div>
  `).join('');
}

window.seekToLyric = function(time) {
  if (audio.duration) audio.currentTime = time;
};

function syncLyrics(currentTime) {
  if (currentLyrics.length === 0) return;

  let newIndex = -1;
  for (let i = 0; i < currentLyrics.length; i++) {
    if (currentTime >= currentLyrics[i].time) {
      newIndex = i;
    } else {
      break;
    }
  }

  if (newIndex !== -1 && newIndex !== activeLyricIndex) {
    activeLyricIndex = newIndex;
    const text = currentLyrics[newIndex].text;
    
    const lineEls = lyricsContainer.querySelectorAll('.lyric-line');
    lineEls.forEach((el, idx) => {
      if (idx === newIndex) {
        el.classList.add('active');
        const containerHeight = lyricsContainer.clientHeight;
        const elOffset = el.offsetTop;
        const elHeight = el.clientHeight;
        lyricsContainer.scrollTo({
          top: elOffset - containerHeight / 2 + elHeight / 2,
          behavior: 'smooth'
        });
      } else {
        el.classList.remove('active');
      }
    });

    updateFloatingText(text);
  }
}

let pipWindow = null;
const inPageFloat = document.getElementById('inPageFloat');
const floatText = document.getElementById('floatText');
const closeFloatBtn = document.getElementById('closeFloatBtn');

      pipWindow.close();
      return;
    }
    try {
      pipWindow = await window.documentPictureInPicture.requestWindow({ width: 350, height: 120 });

      `;

      pipWindow.document.body.innerHTML = '<div id="pipText">等待歌词...</div>';
      
      pipWindow.addEventListener('pagehide', () => { 
        pipWindow = null; 
        floatLyricBtn.classList.remove('active'); 
      });

    }
  } else {

closeFloatBtn.addEventListener('click', () => {
  inPageFloat.style.display = 'none';
  floatLyricBtn.classList.remove('active');
});

let isDraggingFloat = false, startXFloat, startYFloat, initialLeftFloat, initialTopFloat;
inPageFloat.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.float-close')) return;
  isDraggingFloat = true;
  startXFloat = e.clientX; startYFloat = e.clientY;
  const rect = inPageFloat.getBoundingClientRect();
  initialLeftFloat = rect.left; initialTopFloat = rect.top;
  inPageFloat.style.bottom = 'auto'; inPageFloat.style.right = 'auto';
  inPageFloat.setPointerCapture(e.pointerId);
});
inPageFloat.addEventListener('pointermove', (e) => {
  if (!isDraggingFloat) return;
  inPageFloat.style.left = `${initialLeftFloat + (e.clientX - startXFloat)}px`;
  inPageFloat.style.top = `${initialTopFloat + (e.clientY - startYFloat)}px`;
});
inPageFloat.addEventListener('pointerup', (e) => {
  isDraggingFloat = false;
  inPageFloat.releasePointerCapture(e.pointerId);
});

/* =========================================================
   数据请求与列表渲染
   ========================================================= */
async function fetchSongs() {
  const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${CONFIG.branch}?recursive=1`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('读取失败');
    const data = await res.json();

    const baseUrl = `https://${CONFIG.owner}.github.io/${CONFIG.repo}/`;
    const mp3Files = data.tree.filter(item => item.type === 'blob' && item.path.toLowerCase().endsWith('.mp3'));

    if (mp3Files.length === 0) {
      playlistEl.innerHTML = '<li style="padding:20px;text-align:center;color:#94a3b8;">仓库没有 mp3 文件</li>';
      return;
    }

    const remoteSongs = mp3Files.map(file => {
      const fileName = file.path.split('/').pop();
      const encodedPath = file.path.split('/').map(encodeURIComponent).join('/');
      return {
        name: fileName.replace(/\.mp3$/i, ''),
        path: file.path,
        url: baseUrl + encodedPath
      };
    });

    const localSongs = allSongs.filter(s => s.isLocal);
    allSongs = [...localSongs, ...remoteSongs];

    applySavedOrder();
    updateTagSelect();
    renderPlaylist();
    
    if (currentIndex === -1) {
      songTitle.textContent = '准备就绪';
      songArtist.textContent = '点击列表开始播放';
    }
  } catch (error) {
    console.error(error);
    playlistEl.innerHTML = `<li style="padding:20px;text-align:center;color:#ef4444;">❌ 读取失败: ${escapeHtml(error.message)}</li>`;
  }
}

function applySavedOrder() {
  if (savedOrder.length === 0) return;
  allSongs.sort((a, b) => {
    const iA = savedOrder.indexOf(a.path);
    const iB = savedOrder.indexOf(b.path);
    if (iA !== -1 && iB !== -1) return iA - iB;
    if (iA !== -1) return -1;
    if (iB !== -1) return 1;
    return 0;
  });
}

function updateTagSelect() {
  const currentVal = filterSelect.value;
  filterSelect.innerHTML =
    '<option value="">全部歌曲</option>' +
    '<option value="__untagged__">Uncategorized未分类</option>' +
    globalTags.map(tag => `<option value="${escapeHtml(tag)}">${escapeHtml(tag)}</option>`).join('');

  if (currentVal === '' || currentVal === '__untagged__' || globalTags.includes(currentVal)) {
    filterSelect.value = currentVal;
  } else {
    filterSelect.value = '';
  }
}

filterSelect.addEventListener('change', renderPlaylist);

let searchDebounceTimer = null;
songSearchInput.addEventListener('input', () => {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(renderPlaylist, 150);
});

addTagBtn.addEventListener('click', () => {
  const val = newTagInput.value.trim();
  if (!val) return;
  if (globalTags.includes(val)) { alert('标签已存在'); return; }
  globalTags.push(val);
  localStorage.setItem('mp_tags_pool', JSON.stringify(globalTags));
  newTagInput.value = '';
  updateTagSelect();
});

function renderPlaylist() {
  const filterTag = filterSelect.value;
  const searchTerm = (songSearchInput.value || '').trim().toLowerCase();

  displaySongs = allSongs.filter(song => {
    if (filterTag === '__untagged__') {
      const tags = songTagsMap[song.path] || [];
      if (tags.length > 0) return false;
    } else if (filterTag) {
      const tags = songTagsMap[song.path] || [];
      if (!tags.includes(filterTag)) return false;
    }
    if (searchTerm && !song.name.toLowerCase().includes(searchTerm)) return false;
    return true;
  });

  songCount.textContent = `(${displaySongs.length})`;

  if (displaySongs.length === 0) {
    playlistEl.innerHTML = '<li style="padding:20px;text-align:center;color:#94a3b8;">没有符合条件的歌曲</li>';
    updateSelectionUI();
    return;
  }

  const html = displaySongs.map((song, index) => {
    const isActive = index === currentIndex ? 'active' : '';
    const tags = songTagsMap[song.path] || [];
    const tagHtml = tags.map(t => `<span class="mini-tag">${escapeHtml(t)}</span>`).join('');
    const cover = getCoverUrl(song.path);

    const isSelected = selectedPaths.has(song.path);
    const checkHtml = selectionMode ? '<div class="track-check"></div>' : '';
    const selectableCls = selectionMode ? 'selectable' : '';
    const selectedCls = isSelected ? 'selected' : '';
    const draggable = selectionMode ? 'false' : 'true';

    const pathDisplay = song.isLocal
      ? ('📁 本地文件 · ' + (song.file ? song.file.name : song.name))
      : song.path;
    const pathClass = song.isLocal ? 'track-path local' : 'track-path';

    return `
      <li class="track-item ${isActive} ${selectableCls} ${selectedCls}" draggable="${draggable}" data-index="${index}" data-path="${escapeHtml(song.path)}">
        ${checkHtml}
        <img class="track-icon" src="${cover}" loading="lazy" alt="cover">
        <div class="track-info">
          <div class="track-name">${escapeHtml(song.name)}</div>
          <div class="${pathClass}">${escapeHtml(pathDisplay)}</div>
          <div class="song-tags">${tagHtml}</div>
        </div>
        <div class="playing-indicator"><i></i><i></i><i></i></div>
        <button class="btn-more" data-more-path="${escapeHtml(song.path)}">⋮</button>
      </li>
    `;
  }).join('');

  playlistEl.innerHTML = html;

  bindDragEvents();
  
  if (currentIndex >= 0 && currentIndex < displaySongs.length) {
    setTimeout(() => {
      document.querySelectorAll('.track-item.active').forEach(item => item.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
    }, 100);
  }

  updateSelectionUI();
}

/* =========================================================
   菜单与标签
   ========================================================= */
window.openMenu = function(e, path) {
  e.stopPropagation();
  activeMenuPath = path;
  const currentTags = songTagsMap[path] || [];

  if (globalTags.length === 0) {
    menuTags.innerHTML = '<div style="padding:10px; font-size:12px; color:#999;">暂无标签</div>';
  } else {
    menuTags.innerHTML = globalTags.map(tag => `
      <label class="menu-tag-label">
        <input type="checkbox" value="${escapeHtml(tag)}" ${currentTags.includes(tag) ? 'checked' : ''} data-tag="${escapeHtml(tag)}">
        ${escapeHtml(tag)}
      </label>
    `).join('');

    menuTags.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', function() {
        toggleSongTag(activeMenuPath, this.dataset.tag, this.checked);
      });
    });
  }

  const rect = e.target.getBoundingClientRect();
  contextMenu.style.display = 'block';
  
  let top = rect.bottom + 5;
  if (top + contextMenu.offsetHeight > window.innerHeight) top = rect.top - contextMenu.offsetHeight - 5;
  let left = rect.left - 100;
  if (left + contextMenu.offsetWidth > window.innerWidth) left = window.innerWidth - contextMenu.offsetWidth - 10;

  contextMenu.style.top = top + 'px';
  contextMenu.style.left = left + 'px';
}

document.addEventListener('click', () => { contextMenu.style.display = 'none'; });

window.toggleSongTag = function(path, tag, isChecked) {
  if (!songTagsMap[path]) songTagsMap[path] = [];
  if (isChecked) {
    if (!songTagsMap[path].includes(tag)) songTagsMap[path].push(tag);
  } else {
    songTagsMap[path] = songTagsMap[path].filter(t => t !== tag);
  }
  localStorage.setItem('mp_song_tags', JSON.stringify(songTagsMap));
  renderPlaylist();
}

downloadBtn.addEventListener('click', () => {
  const song = allSongs.find(s => s.path === activeMenuPath);
  if (song) {
    if (song.isLocal) {
      const a = document.createElement('a');
      a.href = song.blobUrl;
      a.download = song.file ? song.file.name : (song.name + '.mp3');
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } else {
      const a = document.createElement('a');
      a.href = song.url; a.download = song.name + '.mp3';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
  }
});

/* =========================================================
   拖拽排序
   ========================================================= */
let draggedItem = null;

function bindDragEvents() {
  document.querySelectorAll('.track-item').forEach(item => {
    item.addEventListener('dragstart', (e) => {
      if (selectionMode) { e.preventDefault(); return; }
      draggedItem = item;
      setTimeout(() => item.classList.add('dragging'), 0);
    });
    item.addEventListener('dragend', () => {
      if (!draggedItem) return;
      draggedItem.classList.remove('dragging');
      draggedItem = null;
      saveNewOrder();
    });
    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (!draggedItem || draggedItem === item) return;
      const rect = item.getBoundingClientRect();
      const offset = e.clientY - rect.top;
      if (offset > rect.height / 2) {
        item.parentNode.insertBefore(draggedItem, item.nextSibling);
      } else {
        item.parentNode.insertBefore(draggedItem, item);
      }
    });
  });
}

function saveNewOrder() {
  if (!playlistEl) return;
  const newPaths = Array.from(playlistEl.querySelectorAll('.track-item')).map(li => li.dataset.path);
  
  allSongs.sort((a, b) => {
    const iA = newPaths.indexOf(a.path);
    const iB = newPaths.indexOf(b.path);
    if (iA !== -1 && iB !== -1) return iA - iB;
    if (iA !== -1) return -1;
    if (iB !== -1) return 1;
    return 0;
  });
  localStorage.setItem('mp_song_order', JSON.stringify(allSongs.filter(s => !s.isLocal).map(s => s.path)));
}

/* =========================================================
   播放逻辑
   ========================================================= */
function loadSong(index, autoPlay = true) {
  if (index < 0 || index >= displaySongs.length) return;
  
  if (currentIndex === index && audio.src === displaySongs[index].url) {
    if (isPlaying) audio.pause();
    else audio.play();
    return;
  }

  currentIndex = index;
  const song = displaySongs[index];

  songTitle.textContent = song.name;
  songArtist.textContent = song.isLocal
    ? ('本地文件 · ' + (song.file ? song.file.name : song.name))
    : song.path;
  document.title = `${song.name} - 音乐播放器`;

  const coverUrl = getCoverUrl(song.path);
  mainCover.src = coverUrl;
  bgBlur.style.backgroundImage = `url('${coverUrl}')`;

  document.querySelectorAll('.track-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll(`.track-item[data-index="${index}"]`).forEach(el => el.classList.add('active'));

  audio.src = song.url;
  fetchLyrics(song.name);

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: song.name,
        artist: song.isLocal ? '本地文件' : '我的音乐收藏',
        artwork: [{ src: coverUrl, sizes: '500x500', type: 'image/jpeg' }]
      });
      navigator.mediaSession.setActionHandler('play', () => audio.play());
      navigator.mediaSession.setActionHandler('pause', () => audio.pause());
      navigator.mediaSession.setActionHandler('previoustrack', () => handleNextPrev('prev'));
      navigator.mediaSession.setActionHandler('nexttrack', () => handleNextPrev('next'));
      navigator.mediaSession.setActionHandler('seekbackward', (d) => {
        audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10));
      });
      navigator.mediaSession.setActionHandler('seekforward', (d) => {
        audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (d.seekOffset || 10));
      });
      navigator.mediaSession.setActionHandler('seekto', (d) => {
        if (typeof d.seekTime === 'number') audio.currentTime = d.seekTime;
      });
    } catch (e) {
      console.warn('mediaSession 设置失败', e);
    }
  }

  if (autoPlay) {
    audio.play().catch(err => {
      console.warn('播放被拦截', err);
      isPlaying = false;
      updatePlayBtnUI();
    });
  }
}

function playAudio() {
  if (currentIndex === -1 && displaySongs.length > 0) {
    loadSong(isShuffle ? getRandomIndex() : 0);
  } else {
    audio.play();
  }
}

function pauseAudio() { audio.pause(); }

function updatePlayBtnUI() {
  if (isPlaying) {
    iconPlay.classList.add('hide');
    iconPause.classList.remove('hide');
  } else {
    iconPause.classList.add('hide');
    iconPlay.classList.remove('hide');
  }
}

function getNextIndex() {
  if (displaySongs.length === 0) return -1;
  if (displaySongs.length === 1) return 0;
  if (isShuffle) return getRandomIndex();
  if (currentIndex === displaySongs.length - 1) {
    if (repeatMode === 'off') return -1;
    return 0;
  }
  return currentIndex + 1;
}

function getRandomIndex() {
  if (displaySongs.length <= 1) return 0;
  let newIndex;
  do { newIndex = Math.floor(Math.random() * displaySongs.length); } while (newIndex === currentIndex);
  return newIndex;
}

function handleNextPrev(direction) {
  if (displaySongs.length === 0) return;
  if (direction === 'next') {
    const nextIdx = getNextIndex();
    if (nextIdx === -1) {
      audio.pause(); audio.currentTime = 0;
      isPlaying = false; updatePlayBtnUI();
    } else {
      loadSong(nextIdx);
    }
  } else {
    let prevIdx = isShuffle ? getRandomIndex() : currentIndex - 1;
    if (prevIdx < 0) prevIdx = displaySongs.length - 1;
    loadSong(prevIdx);
  }
}

/* =========================================================
   事件监听
   ========================================================= */
playlistEl.addEventListener('click', (e) => {
  const moreBtn = e.target.closest('.btn-more');
  if (moreBtn) {
    e.stopPropagation();
    openMenu(e, moreBtn.dataset.morePath);
    return;
  }

  const li = e.target.closest('.track-item');
  if (!li) return;

  if (selectionMode) {
    const path = li.dataset.path;
    if (selectedPaths.has(path)) selectedPaths.delete(path);
    else selectedPaths.add(path);
    li.classList.toggle('selected');
    updateSelectionUI();
    return;
  }

  const index = parseInt(li.dataset.index);
  loadSong(index);
  
  // 手机端选中歌曲后自动返回播放页
  if (window.innerWidth <= 768) {
    closeListView();
  }
});

playBtn.addEventListener('click', () => { isPlaying ? pauseAudio() : playAudio(); });
prevBtn.addEventListener('click', () => handleNextPrev('prev'));
nextBtn.addEventListener('click', () => handleNextPrev('next'));

modeBtn.addEventListener('click', () => {
  if (repeatMode === 'all') {
    repeatMode = 'one';
    iconRepeatAll.classList.add('hide');
    iconRepeatOne.classList.remove('hide');
    iconRepeatOff.classList.add('hide');
    modeBtn.classList.add('active');
    modeBtn.title = '单曲循环';
  } else if (repeatMode === 'one') {
    repeatMode = 'off';
    iconRepeatAll.classList.add('hide');
    iconRepeatOne.classList.add('hide');
    iconRepeatOff.classList.remove('hide');
    modeBtn.classList.remove('active');
    modeBtn.title = '顺序播放';
  } else {
    repeatMode = 'all';
    iconRepeatAll.classList.remove('hide');
    iconRepeatOne.classList.add('hide');
    iconRepeatOff.classList.add('hide');
    modeBtn.classList.add('active');
    modeBtn.title = '列表循环';
  }
});

shuffleBtn.addEventListener('click', () => {
  isShuffle = !isShuffle;
  shuffleBtn.classList.toggle('active', isShuffle);
});

audio.addEventListener('play', () => { isPlaying = true; updatePlayBtnUI(); });
audio.addEventListener('pause', () => { isPlaying = false; updatePlayBtnUI(); });
audio.addEventListener('ended', () => {
  if (repeatMode === 'one') {
    audio.currentTime = 0;
    audio.play();
  } else {
    const nextIdx = getNextIndex();
    if (nextIdx === -1) {
      isPlaying = false; updatePlayBtnUI();
    } else {
      loadSong(nextIdx);
    }
  }
});

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const p = audio.currentTime / audio.duration;
  progress.value = p * 1000;
  progress.style.setProperty('--p', (p * 100) + '%');
  curTime.textContent = fmtTime(audio.currentTime);
  syncLyrics(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  durTime.textContent = fmtTime(audio.duration);
  progress.disabled = false;
});

progress.addEventListener('input', () => {
  if (audio.duration) {
    const p = progress.value / 1000;
    progress.style.setProperty('--p', (p * 100) + '%');
    curTime.textContent = fmtTime(p * audio.duration);
  }
});

progress.addEventListener('change', () => {
  if (audio.duration) audio.currentTime = (progress.value / 1000) * audio.duration;
});

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

/* =========================================================
   设置面板 / 批量选择 / 批量缓存 / 批量标签
   ========================================================= */
settingsBtn.addEventListener('click', () => settingsPanel.classList.add('open'));
settingsCloseBtn.addEventListener('click', () => settingsPanel.classList.remove('open'));
cancelSelectionBtn.addEventListener('click', exitSelectionMode);

document.querySelectorAll('.setting-item').forEach(btn => {
  btn.addEventListener('click', () => {
    const action = btn.dataset.action;
    if (action === 'upload') {
      window.open(`https://github.com/${CONFIG.owner}/${CONFIG.repo}/upload/${CONFIG.branch}`, '_blank');
    } else if (action === 'delete') {
      window.open(`https://github.com/${CONFIG.owner}/${CONFIG.repo}`, '_blank');
    } else if (action === 'cache') {
      enterSelectionMode('cache');
    } else if (action === 'tag') {
      enterSelectionMode('tag');
    } else if (action === 'openLocal') {
      openLocalFilePicker();
    } else if (action === 'setCacheDir') {
      pickCacheDir();
    } else if (action === 'clearCacheDir') {
      if (confirm('确定要清除已设置的缓存目录吗？\n清除后缓存歌曲将回到浏览器默认下载目录。')) {
        clearCacheDir();
      }
    }
  });
});

function enterSelectionMode(mode) {
  selectionMode = mode;
  selectedPaths.clear();
  settingsPanel.classList.remove('open');
  listPage.classList.add('selection-mode');
  renderBatchBar();
  renderPlaylist();
  playlistEl.scrollTop = 0;
}

function exitSelectionMode() {
  selectionMode = null;
  selectedPaths.clear();
  listPage.classList.remove('selection-mode');
  batchBar.classList.remove('show');
  batchActions.innerHTML = '';
  renderPlaylist();
}

function renderBatchBar() {
  if (!selectionMode) {
    batchBar.classList.remove('show');
    batchActions.innerHTML = '';
    return;
  }
  batchBar.classList.add('show');

  if (selectionMode === 'cache') {
    batchActions.innerHTML = `
      <button class="batch-btn" id="doCacheBtn" disabled>⬇ 缓存选中</button>
      <button class="batch-btn ghost" id="cancelBatchBtn">取消</button>
    `;
    document.getElementById('doCacheBtn').addEventListener('click', doCacheSelected);
    document.getElementById('cancelBatchBtn').addEventListener('click', exitSelectionMode);

  } else {
    if (globalTags.length === 0) {
      batchActions.innerHTML = `
        <input type="text" class="batch-select" id="batchNewTagInput" placeholder="输入新标签名...">
        <button class="batch-btn" id="batchCreateTagBtn">创建标签</button>
        <button class="batch-btn ghost" id="cancelBatchBtn2">取消</button>
      `;
      document.getElementById('batchCreateTagBtn').addEventListener('click', () => {
        const val = document.getElementById('batchNewTagInput').value.trim();
        if (!val) return;
        if (!globalTags.includes(val)) {
          globalTags.push(val);
          localStorage.setItem('mp_tags_pool', JSON.stringify(globalTags));
          updateTagSelect();
        }
        renderBatchBar();
      });
      document.getElementById('cancelBatchBtn2').addEventListener('click', exitSelectionMode);
    } else {
      const opts = globalTags.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
      batchActions.innerHTML = `
        <select class="batch-select" id="batchTagSelect">
          <option value="">选择标签</option>${opts}
        </select>
        <button class="batch-btn" id="batchAddBtn" disabled>添加</button>
        <button class="batch-btn ghost" id="batchRemoveBtn" disabled>移除</button>
        <button class="batch-btn ghost" id="cancelBatchBtn2">取消</button>
      `;
      document.getElementById('batchAddBtn').addEventListener('click', () => applyBatchTag(false));
      document.getElementById('batchRemoveBtn').addEventListener('click', () => applyBatchTag(true));
      document.getElementById('cancelBatchBtn2').addEventListener('click', exitSelectionMode);
    }
  }

  updateSelectionUI();
}

function updateSelectionUI() {
  if (selectionCount) selectionCount.textContent = `已选 ${selectedPaths.size} 首`;
  const n = selectedPaths.size;

  const ids = ['doCacheBtn', 'batchAddBtn', 'batchRemoveBtn'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = n === 0;
  });
}

function applyBatchTag(isRemove) {
  const sel = document.getElementById('batchTagSelect');
  const tag = sel ? sel.value : '';
  if (!tag) { alert('请先选择一个标签'); return; }
  if (selectedPaths.size === 0) { alert('请先勾选歌曲'); return; }

  selectedPaths.forEach(path => {
    if (!songTagsMap[path]) songTagsMap[path] = [];
    if (isRemove) {
      songTagsMap[path] = songTagsMap[path].filter(t => t !== tag);
    } else {
      if (!songTagsMap[path].includes(tag)) songTagsMap[path].push(tag);
    }
  });

  localStorage.setItem('mp_song_tags', JSON.stringify(songTagsMap));
  renderPlaylist();
}

async function doCacheSelected() {
  if (selectedPaths.size === 0) { alert('请先勾选歌曲'); return; }

  const paths = [...selectedPaths].filter(p => {
    const s = allSongs.find(x => x.path === p);
    return s && !s.isLocal;
  });

  if (paths.length === 0) {
    alert('选中的歌曲都是本地文件，无需缓存');
    return;
  }

  const btn = document.getElementById('doCacheBtn');
  if (btn) { btn.disabled = true; }

  let useDir = false;
  if (cacheDirHandle) {
    useDir = await ensureDirPermission();
    if (!useDir) {
      console.warn('缓存目录权限未获得，降级为默认下载');
    }
  }

  let ok = 0, fail = 0;

  for (let i = 0; i < paths.length; i++) {
    const song = allSongs.find(s => s.path === paths[i]);
    if (!song) { fail++; continue; }

    if (btn) btn.textContent = `缓存中 ${i + 1}/${paths.length}`;

    try {
      const res = await fetch(song.url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();

      let saved = false;
      if (useDir) {
        saved = await writeBlobToDir(song.name + '.mp3', blob);
      }

      if (!saved) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = song.name + '.mp3';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }

      ok++;
      await new Promise(r => setTimeout(r, useDir ? 50 : 400));
    } catch (err) {
      console.warn('缓存失败:', song.path, err);
      fail++;
    }
  }

  if (btn) { btn.disabled = false; btn.textContent = '⬇ 缓存选中'; }

  const target = useDir ? `"${cacheDirHandle.name}" 目录` : '浏览器默认下载目录';
  alert(fail === 0
    ? `✅ 缓存完成，共 ${ok} 首歌曲已保存到 ${target}`
    : `缓存完成：成功 ${ok} 首，失败 ${fail} 首（保存至 ${target}）`);
}

/* =========================================================
   工具下拉菜单（转换器 / search）
   ========================================================= */
const converterBtn = document.getElementById('converterBtn');
const searchBtn = document.getElementById('searchBtn');
const converterMenu = document.getElementById('converterMenu');
const searchMenu = document.getElementById('searchMenu');
const youtubeOption = document.getElementById('youtubeOption');

function showToolMenu(menuEl, btnEl) {
  document.querySelectorAll('.tool-menu').forEach(m => m.classList.remove('show'));

  menuEl.classList.add('show');

  menuEl.style.visibility = 'hidden';
  menuEl.style.left = '0px';
  menuEl.style.top = '0px';
  const mw = menuEl.offsetWidth;

  const rect = btnEl.getBoundingClientRect();
  const padding = 8;

  let left = rect.left + rect.width / 2 - mw / 2;
  if (left < padding) left = padding;
  if (left + mw > window.innerWidth - padding) left = window.innerWidth - mw - padding;

  menuEl.style.left = left + 'px';
  menuEl.style.top = (rect.bottom + 6) + 'px';
  menuEl.style.visibility = 'visible';
}

converterBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (converterMenu.classList.contains('show')) {
    converterMenu.classList.remove('show');
  } else {
    showToolMenu(converterMenu, converterBtn);
  }
});

searchBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (searchMenu.classList.contains('show')) {
    searchMenu.classList.remove('show');
  } else {
    showToolMenu(searchMenu, searchBtn);
  }
});

document.querySelectorAll('.tool-menu .tool-menu-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.tool-menu').forEach(m => m.classList.remove('show'));
  });
});

document.addEventListener('click', (e) => {
  if (e.target.closest('.tool-menu') || e.target.closest('#converterBtn') || e.target.closest('#searchBtn')) return;
  document.querySelectorAll('.tool-menu').forEach(m => m.classList.remove('show'));
});

window.addEventListener('resize', () => {
  document.querySelectorAll('.tool-menu').forEach(m => m.classList.remove('show'));
});

youtubeOption.addEventListener('click', (e) => {
  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);

  if (!isAndroid && !isIOS) return;

  e.preventDefault();
  const webUrl = 'https://www.youtube.com';

  if (isAndroid) {
    window.location.href = 'intent://www.youtube.com#Intent;package=com.google.android.youtube;scheme=https;S.browser_fallback_url=' +
      encodeURIComponent(webUrl) + ';end';
  } else {
    const start = Date.now();
    let switched = false;
    const onVis = () => { if (document.hidden) switched = true; };
    document.addEventListener('visibilitychange', onVis);

    window.location.href = 'youtube://www.youtube.com';

    setTimeout(() => {
      document.removeEventListener('visibilitychange', onVis);
      if (!switched && !document.hidden && Date.now() - start < 3000) {
        window.open(webUrl, '_blank');
      }
    }, 1200);
  }
});

/* =========================================================
   初始化
   ========================================================= */
updateTagSelect();
fetchSongs();
restoreCacheDirHandle();
</script>
