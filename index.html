<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>沉浸式音乐播放器</title>
<style>
  :root {
    --primary: #ef4444;
    --primary-dark: #dc2626;
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
    --bg-color: #0f172a;
    --glass-bg: rgba(30, 41, 59, 0.65);
    --glass-border: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
  }

  /* ================= 整体布局 ================= */
  .main-container {
    width: 100%;
    max-width: 1050px;
    height: 100%;
    max-height: 900px;
    display: flex;
    gap: 0;
    position: relative;
    overflow: hidden;
  }

  .bg-blur {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-size: cover;
    background-position: center;
    filter: blur(40px) brightness(0.4);
    z-index: -1;
    transform: scale(1.2);
    transition: background-image 0.5s;
  }

  /* ================= 播放页 ================= */
  .player-page {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 24px 40px;
    position: relative;
    z-index: 10;
    height: 100%;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: transform 0.3s ease-in-out;
  }

  .player-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 48px;
    margin-bottom: 20px;
  }
  .nav-icon {
    color: var(--text-main);
    font-size: 20px;
    cursor: pointer;
    opacity: 0.8;
    width: 36px; height: 36px;
    display: flex; justify-content: center; align-items: center;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
  }
  .nav-icon:hover { background: rgba(255,255,255,0.15); opacity: 1; }
  .url-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 6px 16px;
    border-radius: 20px;
    color: var(--text-main);
    text-decoration: none;
    font-size: 13px;
    transition: all 0.2s;
  }
  .url-btn:hover { background: rgba(255,255,255,0.2); }

  .cover-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    width: 100%;
    min-height: 0;
  }

  .cover-img {
    width: 280px;
    height: 280px;
    border-radius: 24px;
    object-fit: cover;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2;
    flex-shrink: 0;
  }
  
  .cover-img.lyrics-mode {
    transform: translateY(-120%) scale(0.6);
    opacity: 0;
    pointer-events: none;
  }
  
  .lyrics-container {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: auto;
    text-align: center;
    padding: 35% 20px;
    mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
    scroll-behavior: smooth;
    z-index: 3;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease 0.2s;
  }
  .lyrics-container::-webkit-scrollbar { display: none; }
  .lyrics-container.active { opacity: 1; pointer-events: auto; }
  
  .lyric-line {
    font-size: 16px;
    color: rgba(255,255,255,0.4);
    line-height: 2.2;
    transition: all 0.3s;
    cursor: pointer;
    padding: 4px 0;
    transform-origin: center;
  }
  .lyric-line:hover { color: rgba(255,255,255,0.8); }
  .lyric-line.active {
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    transform: scale(1.05);
    text-shadow: 0 2px 10px rgba(255,255,255,0.3);
  }
  .no-lyrics { font-size: 14px; color: var(--text-sub); margin-top: 20px; }

  .song-meta { 
    text-align: center; 
    margin-top: 20px; 
    padding: 0 10px; 
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .song-meta.lyrics-mode {
    transform: translateY(-200px); 
    opacity: 0;
    pointer-events: none;
  }

  .song-title-lg {
    font-size: 24px; 
    font-weight: 700; 
    margin-bottom: 8px;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: break-all;
  }
  .song-artist-lg { 
    font-size: 14px; 
    color: var(--text-sub); 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis;
  }

  .progress-area { margin-top: 20px; width: 100%; flex-shrink: 0; }
  .time-wrap {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--text-sub);
    margin-bottom: 10px; font-variant-numeric: tabular-nums;
  }
  input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%;
    background: #fff; margin-top: -4px; box-shadow: 0 0 10px rgba(255,255,255,0.5); transition: transform 0.1s;
  }
  input[type=range]:active::-webkit-slider-thumb { transform: scale(1.3); }
  #progress::-webkit-slider-runnable-track { background: linear-gradient(to right, #fff var(--p,0%), rgba(255,255,255,0.15) var(--p,0%)); }

  .controls {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 20px; margin-bottom: 10px; padding: 0 10px;
    flex-shrink: 0;
  }
  .btn-icon {
    background: none; border: none; color: rgba(255,255,255,0.6); font-size: 22px;
    cursor: pointer; transition: 0.2s; width: 44px; height: 44px;
    border-radius: 50%; display: flex; justify-content: center; align-items: center;
  }
  .btn-icon:hover { color: #fff; background: rgba(255,255,255,0.1); }
  .btn-icon.active { color: var(--primary); }
  
  .btn-icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  
  .btn-play-main {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--primary); border: none; color: #fff; font-size: 28px;
    display: flex; justify-content: center; align-items: center; cursor: pointer;
    box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
    transition: transform 0.1s, background 0.2s;
  }
  .btn-play-main:hover { background: var(--primary-dark); transform: scale(1.05); }
  .btn-play-main:active { transform: scale(0.95); }
  .btn-play-main svg { width: 32px; height: 32px; fill: currentColor; }

  .hide { display: none !important; }

  /* ================= 列表页 ================= */
  .list-page {
    flex: 0 0 400px;
    min-width: 400px;
    background: var(--glass-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-left: 1px solid var(--glass-border);
    display: flex; flex-direction: column; height: 100%; z-index: 20;
    transition: transform 0.3s ease-in-out;
  }

  .list-header { padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  
  .mobile-back-btn { display: none; }

  .header-top h2 { font-size: 18px; font-weight: 600; }
  .header-top span { font-size: 13px; color: var(--text-sub); font-weight: 400; }

  .header-btn {
    background: rgba(255,255,255,0.08);
    border: none; color: var(--text-main);
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; margin-left: auto; flex-shrink: 0;
    transition: background .2s, transform .3s;
  }
  .header-btn:hover { background: rgba(255,255,255,0.18); transform: rotate(60deg); }
  .header-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .tag-manager { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .tag-select {
    padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.2); color: #fff; outline: none; font-size: 13px; cursor: pointer;
  }
  .tag-select option { background: #1e293b; color: #fff; }
  .tag-input-wrap { display: flex; gap: 6px; margin-left: auto; }
  .tag-input {
    padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.2); color: #fff; outline: none; font-size: 12px; width: 90px;
  }
  .tag-input:focus { border-color: var(--primary); }
  .btn-add-tag {
    padding: 6px 12px; border-radius: 8px; border: none;
    background: var(--primary); color: white; font-size: 12px; cursor: pointer; transition: 0.2s;
  }
  .btn-add-tag:hover { background: var(--primary-dark); }

  .playlist { list-style: none; overflow-y: auto; flex: 1; padding: 12px; }
  .playlist::-webkit-scrollbar { width: 4px; }
  .playlist::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

  .track-item {
    display: flex; align-items: center; gap: 14px; padding: 10px 12px;
    border-radius: 12px; cursor: pointer; transition: background 0.2s; margin-bottom: 4px;
  }
  .track-item:hover { background: rgba(255,255,255,0.05); }
  .track-item.active { background: rgba(239, 68, 68, 0.15); }
  .track-item.active .track-name { color: var(--primary); font-weight: 700; }
  .track-item.dragging { opacity: 0.5; background: rgba(255,255,255,0.1); }
  .track-item.drag-over { border-top: 2px solid var(--primary); }

  .track-icon { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #1e293b; flex-shrink: 0; }
  .track-info { flex: 1; min-width: 0; }
  .track-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-path { font-size: 11px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .mini-tag { font-size: 10px; background: rgba(239,68,68,0.2); color: #fca5a5; padding: 2px 6px; border-radius: 4px; }

  .playing-indicator { display: none; gap: 3px; align-items: flex-end; height: 12px; margin-right: 4px; }
  .track-item.active .playing-indicator { display: flex; }
  .playing-indicator i { display: block; width: 2px; background: var(--primary); border-radius: 1px; animation: eq 1s infinite ease-in-out; }
  .playing-indicator i:nth-child(1) { height: 60%; animation-delay: 0s; }
  .playing-indicator i:nth-child(2) { height: 100%; animation-delay: -0.2s; }
  .playing-indicator i:nth-child(3) { height: 40%; animation-delay: -0.4s; }
  @keyframes eq { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }

  .btn-more { background: none; border: none; font-size: 20px; color: var(--text-sub); cursor: pointer; padding: 0 6px; line-height: 1; transition: 0.2s; }
  .btn-more:hover { color: #fff; }

  /* ================= 悬浮菜单 ================= */
  .context-menu {
    position: fixed; background: #1e293b; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); padding: 8px;
    min-width: 160px; z-index: 1000; display: none;
  }
  .menu-item { padding: 10px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: #e2e8f0; }
  .menu-item:hover { background: rgba(255,255,255,0.1); }
  .menu-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 6px 0; }
  .menu-title { font-size: 11px; color: var(--text-sub); padding: 4px 12px; }
  .menu-tag-label { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; border-radius: 6px; }
  .menu-tag-label:hover { background: rgba(255,255,255,0.1); }
  .menu-tag-label input { accent-color: var(--primary); }

  /* ================= 页内悬浮歌词 ================= */
  .floating-lyrics {
    position: fixed; top: 20%; left: 20%;
    background: rgba(15, 23, 42, 0.85); color: #fff;
    padding: 15px 20px; border-radius: 16px;
    font-size: 20px; font-weight: bold; text-align: center;
    backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 9999;
    cursor: grab; touch-action: none;
    min-width: 200px; min-height: 60px;
    display: none; flex-direction: column; justify-content: center; align-items: center;
    resize: both; overflow: auto;
  }
  .floating-lyrics:active { cursor: grabbing; }
  .float-close { position: absolute; top: 5px; right: 5px; font-size: 14px; color: #aaa; cursor: pointer; }
  .float-close:hover { color: #fff; }
  .float-text { pointer-events: none; padding: 10px; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }

  /* ================= 设置页 ================= */
  .settings-page {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #0f172a;
    z-index: 40;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: -20px 0 60px rgba(0,0,0,0.6);
  }
  .settings-page.open { transform: translateX(0); }

  .settings-header {
    display: flex; align-items: center; gap: 12px;
    padding: 20px; flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .settings-header h2 { font-size: 17px; font-weight: 600; }

  .settings-body {
    flex: 1; overflow-y: auto; padding: 16px 20px 40px;
    -webkit-overflow-scrolling: touch;
  }
  .settings-body::-webkit-scrollbar { width: 4px; }
  .settings-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

  .setting-item {
    display: flex; align-items: center; gap: 14px;
    padding: 16px; border-radius: 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 10px; cursor: pointer; transition: 0.2s;
  }
  .setting-item:hover { background: rgba(255,255,255,0.09); border-color: rgba(239,68,68,0.4); }
  .setting-ico {
    width: 38px; height: 38px; border-radius: 10px;
    background: rgba(239,68,68,0.15); color: var(--primary);
    display: flex; justify-content: center; align-items: center; flex-shrink: 0;
  }
  .setting-ico svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .setting-text { flex: 1; min-width: 0; }
  .setting-text h3 { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .setting-text p { font-size: 11px; color: var(--text-sub); line-height: 1.5; }

  .sel-toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; background: rgba(255,255,255,0.04);
    border-radius: 10px; margin-bottom: 10px; font-size: 13px;
  }
  .sel-all-label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .sel-all-label input, .sel-item input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
  .sel-count { margin-left: auto; color: var(--text-sub); font-size: 12px; }

  .sel-list { list-style: none; }
  .sel-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px; cursor: pointer;
  }
  .sel-item:hover { background: rgba(255,255,255,0.05); }
  .sel-info { flex: 1; min-width: 0; }
  .sel-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sel-path { font-size: 11px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

  .form-field { margin-bottom: 14px; }
  .form-field label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
  .form-field input[type=text], .form-field select {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1);
    color: #fff; font-size: 13px; outline: none; font-family: inherit;
  }
  .form-field input[type=text]:focus, .form-field select:focus { border-color: var(--primary); }
  .form-field select option { background: #1e293b; color: #fff; }

  .file-drop {
    border: 2px dashed rgba(255,255,255,0.15); border-radius: 14px;
    padding: 28px 16px; text-align: center; cursor: pointer; transition: 0.2s;
    font-size: 13px; color: var(--text-sub); margin-bottom: 14px; line-height: 1.7;
  }
  .file-drop:hover, .file-drop.dragover { border-color: var(--primary); background: rgba(239,68,68,0.06); color: #fff; }

  .btn-primary {
    background: var(--primary); color: #fff; border: none;
    padding: 13px 18px; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: 0.2s; width: 100%; font-family: inherit;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary.btn-danger { background: #dc2626; }
  .btn-primary.btn-danger:hover { background: #b91c1c; }

  .btn-ghost {
    background: rgba(255,255,255,0.08); color: #fff; border: none;
    padding: 13px 18px; border-radius: 10px; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: 0.2s; font-family: inherit;
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.16); }

  .btn-row { display: flex; gap: 10px; }
  .btn-row > button { flex: 1; width: auto; }

  .progress-log {
    font-size: 12px; max-height: 180px; overflow-y: auto;
    background: rgba(0,0,0,0.3); border-radius: 10px; padding: 10px 12px;
    margin-top: 12px; line-height: 1.8; display: none;
    white-space: pre-wrap; word-break: break-all;
  }
  .progress-log.show { display: block; }
  .progress-log::-webkit-scrollbar { width: 4px; }
  .progress-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
  .log-ok { color: #4ade80; }
  .log-err { color: #f87171; }
  .log-info { color: #94a3b8; }

  /* ================= 移动端适配 ================= */
  @media (max-width: 768px) {
    body { padding: 0; align-items: flex-start; }
    .main-container { flex-direction: column; height: 100dvh; overflow: hidden; }
    
    .player-page { 
      padding: 20px; 
      padding-top: 10px; 
      flex: 1; 
      background: transparent; 
      backdrop-filter: none;
      width: 100vw;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
    }
    .player-nav { margin-bottom: 10px; }
    .cover-area { flex: 1; min-height: 300px; justify-content: flex-start; padding-top: 20px; }
    
    .cover-img { width: 220px; height: 220px; border-radius: 16px; }
    .lyrics-container { padding: 45% 20px; }
    .lyric-line { font-size: 15px; line-height: 2; }
    .lyric-line.active { font-size: 18px; }

    .song-meta { margin-top: 15px; }
    .song-title-lg { font-size: 20px; -webkit-line-clamp: 1; }
    .progress-area { margin-top: 20px; }
    .controls { margin-top: 15px; margin-bottom: 10px; }
    .btn-play-main { width: 56px; height: 56px; font-size: 24px; }
    
    .list-page { 
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100%;
      min-width: 100%;
      background: var(--bg-color);
      border-left: none;
      transform: translateX(100%);
      z-index: 20;
    }

    .main-container.show-list .player-page { transform: translateX(-20%); }
    .main-container.show-list .list-page { transform: translateX(0); }

    .mobile-back-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      cursor: pointer;
      margin-right: 12px;
      color: var(--text-main);
      flex-shrink: 0;
    }
    .mobile-back-btn svg {
      width: 20px; height: 20px;
      fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .header-top { justify-content: flex-start; }
    .header-top h2 { font-size: 18px; }
    
    .list-header { padding: 20px; }
    .tag-manager { margin-top: 10px; }
    .settings-body { padding: 14px 16px 40px; }
  }
</style>
</head>
<body>

<script>
/* =========================================================
   配置与状态
   ========================================================= */
const CONFIG = { owner: 'FanyDay102', repo: 'soundsudio', branch: 'main' };

/* ★ 核心修改：彻底移除硬编码 Token，改为从 sessionStorage 获取或用户弹窗输入 */
function getGitHubToken() {
  let token = sessionStorage.getItem('gh_token');
  if (!token) {
    token = prompt("⚠️ 为了安全执行上传或删除操作，请输入你的 GitHub PAT (以 github_pat_ 开头)：\n\n(注意：Token 仅临时保存在当前浏览器中，关闭网页即失效)");
    if (token) {
      token = token.trim();
      sessionStorage.setItem('gh_token', token);
    }
  }
  return token;
}

let allSongs = [];
let displaySongs = [];
let currentIndex = -1;
let isPlaying = false;
let repeatMode = 'all';
let isShuffle = false;

let currentLyrics = [];
let activeLyricIndex = -1;

let globalTags = JSON.parse(localStorage.getItem('mp_tags_pool') || '[]');
let songTagsMap = JSON.parse(localStorage.getItem('mp_song_tags') || '{}');
let savedOrder = JSON.parse(localStorage.getItem('mp_song_order') || '[]');

// DOM
const mainContainer = document.getElementById('mainContainer');
const audio = document.getElementById('audio');
const bgBlur = document.getElementById('bgBlur');

const lyricsContainer = document.getElementById('lyricsContainer');

const songArtist = document.getElementById('songArtist');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const modeBtn = document.getElementById('modeBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const floatLyricBtn = document.getElementById('floatLyricBtn');
const progress = document.getElementById('progress');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');
const filterSelect = document.getElementById('filterSelect');
const newTagInput = document.getElementById('newTagInput');
const addTagBtn = document.getElementById('addTagBtn');
const songCount = document.getElementById('songCount');
const playlistEl = document.getElementById('playlist');
const contextMenu = document.getElementById('contextMenu');
const downloadBtn = document.getElementById('downloadBtn');
const menuTags = document.getElementById('menuTags');

const mobileListBtn = document.getElementById('mobileListBtn');
const backToPlayerBtn = document.getElementById('backToPlayerBtn');

mobileListBtn.addEventListener('click', () => mainContainer.classList.add('show-list'));
backToPlayerBtn.addEventListener('click', () => mainContainer.classList.remove('show-list'));

const iconPlay = document.getElementById('icon-play');
const iconPause = document.getElementById('icon-pause');
const iconRepeatAll = document.getElementById('icon-repeat-all');
const iconRepeatOne = document.getElementById('icon-repeat-one');
const iconRepeatOff = document.getElementById('icon-repeat-off');

let activeMenuPath = '';

function getCoverUrl(seed) {
  return `https://picsum.photos/seed/${encodeURIComponent(seed)}/500/500`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

/* =========================================================
   GitHub API 封装 (使用动态 Token)
   ========================================================= */
function encodePath(p) {
  return p.split('/').map(encodeURIComponent).join('/');
}

async function ghApi(endpoint, options = {}) {
  const token = getGitHubToken();
  if (!token) throw new Error('未提供 GitHub Token，操作取消');

  const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/${endpoint}`, {
    ...options,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(options.headers || {})
    }
  });
  
  if (!res.ok) {
    let msg = `${res.status} ${res.statusText}`;
    try {
      const j = await res.json();
      if (j && j.message) msg = j.message;
    } catch (e) { /* ignore */ }
    
    // 如果是 401 权限错误，清除失效的 Token
    if (res.status === 401) {
      sessionStorage.removeItem('gh_token');
    }
    throw new Error(msg);
  }
  
  if (res.status === 204) return null;
  return res.json();
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = String(reader.result);
      resolve(result.substring(result.indexOf(',') + 1));
    };
    reader.onerror = () => reject(new Error('文件读取失败'));
    reader.readAsDataURL(file);
  });
}

async function ghUpload(file, dir) {
  const cleanDir = (dir || '').replace(/^\/+|\/+$/g, '');
  const path = cleanDir ? `${cleanDir}/${file.name}` : file.name;
  const base64 = await fileToBase64(file);
  await ghApi(`contents/${encodePath(path)}`, {
    method: 'PUT',
    body: JSON.stringify({
      message: `上传 ${file.name}（网页上传）`,
      content: base64,
      branch: CONFIG.branch
    })
  });
  return path;
}

async function ghGetSha(path) {
  const data = await ghApi(`contents/${encodePath(path)}?ref=${encodeURIComponent(CONFIG.branch)}`);
  return data.sha;
}

async function ghDelete(path, sha) {
  await ghApi(`contents/${encodePath(path)}`, {
    method: 'DELETE',
    body: JSON.stringify({
      message: `删除 ${path}（网页删除）`,
      sha,
      branch: CONFIG.branch
    })
  });
}

/* =========================================================
   歌词
   ========================================================= */
async function fetchLyrics(songName) {
  mainCover.classList.remove('lyrics-mode');
  songMeta.classList.remove('lyrics-mode');
  lyricsContainer.classList.remove('active');
  currentLyrics = [];
  activeLyricIndex = -1;

  let title = songName;
  let artist = '';
  if (songName.includes(' - ')) {
    const parts = songName.split(' - ');
    artist = parts[0].trim();
    title = parts[1].trim();
  }

  try {
    let apiUrl = `https://lrclib.net/api/get?track_name=${encodeURIComponent(title)}`;
    if (artist) apiUrl += `&artist_name=${encodeURIComponent(artist)}`;

    let res = await fetch(apiUrl, { headers: { 'Lrclib-Client': 'MyHTMLMusicPlayer v1.0' } });

    if (res.status === 404) {
      const query = artist ? `${title} ${artist}` : title;
      apiUrl = `https://lrclib.net/api/search?q=${encodeURIComponent(query)}`;
      res = await fetch(apiUrl, { headers: { 'Lrclib-Client': 'MyHTMLMusicPlayer v1.0' } });
    }

    if (!res.ok) throw new Error('未找到歌词');

    const data = await res.json();
    const result = Array.isArray(data) ? data[0] : data;

    if (!result || !result.syncedLyrics) {
      lyricsContainer.innerHTML = '<div class="no-lyrics">纯音乐 / 暂无同步歌词</div>';
      return;
    }

    parseLRC(result.syncedLyrics);
    if (result.artistName) songArtist.textContent = result.artistName;

    if (currentLyrics.length > 0) {
      mainCover.classList.add('lyrics-mode');
      songMeta.classList.add('lyrics-mode');
      lyricsContainer.classList.add('active');
    }
  } catch (error) {
    console.warn('歌词获取失败:', error);
    lyricsContainer.innerHTML = '<div class="no-lyrics">暂无歌词</div>';
  }
}

function parseLRC(lrcText) {
  const lines = lrcText.split('\n');
  const result = [];
  const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;

  lines.forEach(line => {
    const match = line.match(timeReg);
    if (match) {
      const min = parseInt(match[1]);
      const sec = parseInt(match[2]);
      const ms = parseInt(match[3].padEnd(3, '0'));
      const time = min * 60 + sec + ms / 1000;
      const text = match[4].trim();
      if (text) result.push({ time, text });
    }
  });

  currentLyrics = result;
  if (currentLyrics.length === 0) return;

  lyricsContainer.innerHTML = currentLyrics.map((lyric, index) => `
    <div class="lyric-line" data-index="${index}" onclick="seekToLyric(${lyric.time})">${escapeHtml(lyric.text)}</div>
  `).join('');
}

window.seekToLyric = function (time) {
  if (audio.duration) audio.currentTime = time;
};

function syncLyrics(currentTime) {
  if (currentLyrics.length === 0) return;

  let newIndex = -1;
  for (let i = 0; i < currentLyrics.length; i++) {
    if (currentTime >= currentLyrics[i].time) newIndex = i;
    else break;
  }

  if (newIndex !== -1 && newIndex !== activeLyricIndex) {
    activeLyricIndex = newIndex;
    const text = currentLyrics[newIndex].text;

    const lineEls = lyricsContainer.querySelectorAll('.lyric-line');
    lineEls.forEach((el, idx) => {
      if (idx === newIndex) {
        el.classList.add('active');
        const containerHeight = lyricsContainer.clientHeight;
        const elOffset = el.offsetTop;
        const elHeight = el.clientHeight;
        lyricsContainer.scrollTo({
          top: elOffset - containerHeight / 2 + elHeight / 2,
          behavior: 'smooth'
        });
      } else {
        el.classList.remove('active');
      }
    });

    updateFloatingText(text);
  }
}

/* =========================================================
   悬浮歌词
   ========================================================= */
let pipWindow = null;
const inPageFloat = document.getElementById('inPageFloat');
const floatText = document.getElementById('floatText');
const closeFloatBtn = document.getElementById('closeFloatBtn');

function updateFloatingText(text) {
  if (pipWindow) {
    const el = pipWindow.document.getElementById('pipText');
    if (el) el.textContent = text;
  }
  if (inPageFloat.style.display === 'flex') {
    floatText.textContent = text;
  }
}

floatLyricBtn.addEventListener('click', async () => {
  if ('documentPictureInPicture' in window) {
    if (pipWindow) { pipWindow.close(); return; }
    try {
      pipWindow = await window.documentPictureInPicture.requestWindow({ width: 350, height: 120 });

      const style = pipWindow.document.createElement('style');
      style.textContent = `
        body { margin: 0; background: rgba(15,23,42,0.95); color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; overflow: hidden; }
        #pipText { font-size: 22px; font-weight: bold; text-align: center; padding: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
      `;
      pipWindow.document.head.appendChild(style);
      pipWindow.document.body.innerHTML = '<div id="pipText">等待歌词...</div>';

      pipWindow.addEventListener('pagehide', () => {
        pipWindow = null;

let isDragging = false, startX, startY, initialLeft, initialTop;
inPageFloat.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.float-close')) return;
  isDragging = true;
  startX = e.clientX; startY = e.clientY;
  const rect = inPageFloat.getBoundingClientRect();
  initialLeft = rect.left; initialTop = rect.top;
  inPageFloat.style.bottom = 'auto'; inPageFloat.style.right = 'auto';
  inPageFloat.setPointerCapture(e.pointerId);
});
inPageFloat.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  inPageFloat.style.left = `${initialLeft + (e.clientX - startX)}px`;
  inPageFloat.style.top = `${initialTop + (e.clientY - startY)}px`;
});
inPageFloat.addEventListener('pointerup', (e) => {
  isDragging = false;
  inPageFloat.releasePointerCapture(e.pointerId);
});

/* =========================================================
   数据请求与列表渲染
   ========================================================= */
async function fetchSongs() {
  const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${CONFIG.branch}?recursive=1`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('读取失败');
    const data = await res.json();

    const baseUrl = `https://${CONFIG.owner}.github.io/${CONFIG.repo}/`;
    const mp3Files = data.tree.filter(item => item.type === 'blob' && item.path.toLowerCase().endsWith('.mp3'));

    if (mp3Files.length === 0) {
      playlistEl.innerHTML = '<li style="padding:20px;text-align:center;color:#94a3b8;">仓库没有 mp3 文件</li>';
      allSongs = [];
      renderPlaylist();
      return;
    }

    allSongs = mp3Files.map(file => {
      const fileName = file.path.split('/').pop();
      const encodedPath = file.path.split('/').map(encodeURIComponent).join('/');
      return {
        name: fileName.replace(/\.mp3$/i, ''),
        path: file.path,
        url: baseUrl + encodedPath,
        sha: file.sha
      };
    });

    applySavedOrder();
    updateTagSelect();
    renderPlaylist();

    songTitle.textContent = '准备就绪';
    songArtist.textContent = '点击列表开始播放';
  } catch (error) {
    console.error(error);
    playlistEl.innerHTML = `<li style="padding:20px;text-align:center;color:#ef4444;">❌ 读取失败: ${escapeHtml(error.message)}</li>`;
  }
}

function applySavedOrder() {
  if (savedOrder.length === 0) return;
  allSongs.sort((a, b) => {
    const iA = savedOrder.indexOf(a.path);
    const iB = savedOrder.indexOf(b.path);
    if (iA !== -1 && iB !== -1) return iA - iB;
    if (iA !== -1) return -1;
    if (iB !== -1) return 1;
    return 0;
  });
}

function updateTagSelect() {
  const currentVal = filterSelect.value;
  filterSelect.innerHTML = '<option value="">🎵 全部歌曲</option>' +
    globalTags.map(tag => `<option value="${escapeHtml(tag)}">${escapeHtml(tag)}</option>`).join('');
  if (globalTags.includes(currentVal)) filterSelect.value = currentVal;
}

filterSelect.addEventListener('change', renderPlaylist);

addTagBtn.addEventListener('click', () => {
  const val = newTagInput.value.trim();
  if (!val) return;
  if (globalTags.includes(val)) { alert('标签已存在'); return; }
  globalTags.push(val);
  localStorage.setItem('mp_tags_pool', JSON.stringify(globalTags));
  newTagInput.value = '';
  updateTagSelect();
});

function renderPlaylist() {
  const filterTag = filterSelect.value;
  displaySongs = allSongs.filter(song => {
    if (!filterTag) return true;
    const tags = songTagsMap[song.path] || [];
    return tags.includes(filterTag);
  });

  songCount.textContent = `(${displaySongs.length})`;

  if (displaySongs.length === 0) {
    playlistEl.innerHTML = '<li style="padding:20px;text-align:center;color:#94a3b8;">没有符合条件的歌曲</li>';
    return;
  }

  const html = displaySongs.map((song, index) => {
    const isActive = index === currentIndex ? 'active' : '';
    const tags = songTagsMap[song.path] || [];
    const tagHtml = tags.map(t => `<span class="mini-tag">${escapeHtml(t)}</span>`).join('');
    const cover = getCoverUrl(song.path);

    return `
      <li class="track-item ${isActive}" draggable="true" data-index="${index}" data-path="${escapeHtml(song.path)}">
        <img class="track-icon" src="${cover}" loading="lazy" alt="cover">
        <div class="track-info">
          <div class="track-name">${escapeHtml(song.name)}</div>
          <div class="track-path">${escapeHtml(song.path)}</div>
          <div class="song-tags">${tagHtml}</div>
        </div>
        <div class="playing-indicator"><i></i><i></i><i></i></div>
        <button class="btn-more" onclick="openMenu(event, '${song.path.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}')">⋮</button>
      </li>
    `;
  }).join('');

  playlistEl.innerHTML = html;

  bindDragEvents();

  if (currentIndex >= 0 && currentIndex < displaySongs.length) {
    setTimeout(() => {
      document.querySelectorAll('.track-item.active').forEach(item => item.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
    }, 100);
  }
}

  renderPlaylist();
};

/* =========================================================
   拖拽排序
   ========================================================= */
let draggedItem = null;

function bindDragEvents() {
  document.querySelectorAll('.track-item').forEach(item => {
    item.addEventListener('dragstart', () => {
      draggedItem = item;
      setTimeout(() => item.classList.add('dragging'), 0);
    });
    item.addEventListener('dragend', () => {
      if (!draggedItem) return;
      draggedItem.classList.remove('dragging');
      draggedItem = null;
      saveNewOrder();
    });
    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (!draggedItem || draggedItem === item) return;
      const rect = item.getBoundingClientRect();
      const offset = e.clientY - rect.top;
      if (offset > rect.height / 2) item.parentNode.insertBefore(draggedItem, item.nextSibling);
      else item.parentNode.insertBefore(draggedItem, item);
    });
  });
}

function saveNewOrder() {
  if (!playlistEl) return;
  const newPaths = Array.from(playlistEl.querySelectorAll('.track-item')).map(li => li.dataset.path);

  allSongs.sort((a, b) => {
    const iA = newPaths.indexOf(a.path);
    const iB = newPaths.indexOf(b.path);
    if (iA !== -1 && iB !== -1) return iA - iB;
    if (iA !== -1) return -1;
    if (iB !== -1) return 1;
    return 0;
  });
  localStorage.setItem('mp_song_order', JSON.stringify(allSongs.map(s => s.path)));
}

/* =========================================================
   播放逻辑
   ========================================================= */
function loadSong(index, autoPlay = true) {
  if (index < 0 || index >= displaySongs.length) return;

  if (currentIndex === index && audio.src === displaySongs[index].url) {
    if (isPlaying) audio.pause();
    else audio.play();
    return;
  }

  currentIndex = index;
  const song = displaySongs[index];

  songTitle.textContent = song.name;
  songArtist.textContent = song.path;
  document.title = `${song.name} - 音乐播放器`;

  const coverUrl = getCoverUrl(song.path);
  mainCover.src = coverUrl;
  bgBlur.style.backgroundImage = `url('${coverUrl}')`;

  document.querySelectorAll('.track-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll(`.track-item[data-index="${index}"]`).forEach(el => el.classList.add('active'));

  audio.src = song.url;
  fetchLyrics(song.name);

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.name, artist: '我的音乐收藏',
      artwork: [{ src: coverUrl, sizes: '500x500', type: 'image/jpeg' }]
    });
    navigator.mediaSession.setActionHandler('play', () => audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', () => handleNextPrev('prev'));
    navigator.mediaSession.setActionHandler('nexttrack', () => handleNextPrev('next'));
  }

  if (autoPlay) {
    audio.play().catch(err => {
      console.warn('播放被拦截', err);
      isPlaying = false;
      updatePlayBtnUI();
    });
  }
}

function playAudio() {
  if (currentIndex === -1 && displaySongs.length > 0) {
    loadSong(isShuffle ? getRandomIndex() : 0);
  } else {
    audio.play();
  }
}

function pauseAudio() { audio.pause(); }

function updatePlayBtnUI() {
  if (isPlaying) {
    iconPlay.classList.add('hide');
    iconPause.classList.remove('hide');
  } else {
    iconPause.classList.add('hide');
    iconPlay.classList.remove('hide');
  }
}

function getNextIndex() {
  if (displaySongs.length === 0) return -1;
  if (displaySongs.length === 1) return 0;
  if (isShuffle) return getRandomIndex();
  if (currentIndex === displaySongs.length - 1) {
    if (repeatMode === 'off') return -1;
    return 0;
  }
  return currentIndex + 1;
}

function getRandomIndex() {
  if (displaySongs.length <= 1) return 0;
  let newIndex;
  do { newIndex = Math.floor(Math.random() * displaySongs.length); } while (newIndex === currentIndex);
  return newIndex;
}

function handleNextPrev(direction) {
  if (displaySongs.length === 0) return;
  if (direction === 'next') {
    const nextIdx = getNextIndex();
    if (nextIdx === -1) {
      audio.pause(); audio.currentTime = 0;
      isPlaying = false; updatePlayBtnUI();
    } else {
      loadSong(nextIdx);
    }
  } else {
    let prevIdx = isShuffle ? getRandomIndex() : currentIndex - 1;
    if (prevIdx < 0) prevIdx = displaySongs.length - 1;
    loadSong(prevIdx);
  }
}

    iconRepeatOne.classList.add('hide');

audio.addEventListener('play', () => { isPlaying = true; updatePlayBtnUI(); });
audio.addEventListener('pause', () => { isPlaying = false; updatePlayBtnUI(); });
audio.addEventListener('ended', () => {
  if (repeatMode === 'one') {
    audio.currentTime = 0;
    audio.play();
  } else {
    const nextIdx = getNextIndex();
    if (nextIdx === -1) {
      isPlaying = false; updatePlayBtnUI();
    } else {
      loadSong(nextIdx);
    }
  }
});

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const p = audio.currentTime / audio.duration;
  progress.value = p * 1000;
  progress.style.setProperty('--p', (p * 100) + '%');
  curTime.textContent = fmtTime(audio.currentTime);
  syncLyrics(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  durTime.textContent = fmtTime(audio.duration);
  progress.disabled = false;
});

progress.addEventListener('input', () => {
  if (audio.duration) {
    const p = progress.value / 1000;
    progress.style.setProperty('--p', (p * 100) + '%');
    curTime.textContent = fmtTime(p * audio.duration);
  }
});

progress.addEventListener('change', () => {
  if (audio.duration) audio.currentTime = (progress.value / 1000) * audio.duration;
});

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

/* ---------- 通用多选列表 ---------- */
const BTN_MAP = { del: 'doDeleteBtn', cache: 'doCacheBtn' };

function renderSelList(prefix) {
  const ul = document.getElementById(prefix + 'List');
  const set = selectState[prefix];

  // 清理已经不存在的路径
  Array.from(set).forEach(p => {
    if (!allSongs.some(s => s.path === p)) set.delete(p);
  });

  if (allSongs.length === 0) {
    ul.innerHTML = '<li style="padding:18px;text-align:center;color:#94a3b8;font-size:13px;">暂无可操作的曲目</li>';
    updateSelCount(prefix);
    return;
  }

  ul.innerHTML = allSongs.map(song => `
    <li class="sel-item" data-path="${escapeHtml(song.path)}">
      <input type="checkbox" ${set.has(song.path) ? 'checked' : ''}>
      <div class="sel-info">
        <div class="sel-name">${escapeHtml(song.name)}</div>
        <div class="sel-path">${escapeHtml(song.path)}</div>
      </div>
    </li>
  `).join('');

  ul.querySelectorAll('.sel-item').forEach(li => {
    li.addEventListener('click', (e) => {
      const path = li.dataset.path;
      const cb = li.querySelector('input');
      if (e.target !== cb) cb.checked = !cb.checked;
      if (cb.checked) set.add(path);
      else set.delete(path);
      updateSelCount(prefix);
    });
  });

  updateSelCount(prefix);
}

function updateSelCount(prefix) {
  const n = selectState[prefix].size;
  const countEl = document.getElementById(prefix + 'Count');
  if (countEl) countEl.textContent = `已选 ${n} 首`;

  const allEl = document.getElementById(prefix + 'SelectAll');
  if (allEl) {
    allEl.checked = n > 0 && n === allSongs.length;
    allEl.indeterminate = n > 0 && n < allSongs.length;
  }

  const btnId = BTN_MAP[prefix];
  if (btnId) {
    const btn = document.getElementById(btnId);
    btn.disabled = n === 0;
    if (prefix === 'del') btn.textContent = n ? `删除所选曲目（${n}）` : '删除所选曲目';
    if (prefix === 'cache') btn.textContent = n ? `缓存所选曲目（${n}）` : '缓存所选曲目';
  }
}

['del', 'cache', 'tag'].forEach(prefix => {
  const allEl = document.getElementById(prefix + 'SelectAll');
  allEl.addEventListener('change', () => {
    if (allEl.checked) allSongs.forEach(s => selectState[prefix].add(s.path));
    else selectState[prefix].clear();
    renderSelList(prefix);
  });
});

function logLine(el, text, type = 'info') {
  const div = document.createElement('div');
  div.className = 'log-' + type;
  div.textContent = text;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;

/* ---------- 1. 上传曲目 ---------- */
let pendingFiles = [];

const fileDrop = document.getElementById('fileDrop');
const fileInput = document.getElementById('fileInput');

fileDrop.addEventListener('click', () => fileInput.click());
fileDrop.addEventListener('dragover', (e) => { e.preventDefault(); fileDrop.classList.add('dragover'); });
fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('dragover'));
fileDrop.addEventListener('drop', (e) => {
  e.preventDefault();
  fileDrop.classList.remove('dragover');
  addPendingFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => {
  addPendingFiles(fileInput.files);
  fileInput.value = '';
});

function addPendingFiles(fileList) {
  const files = Array.from(fileList).filter(f => /\.mp3$/i.test(f.name));
  if (files.length === 0) {
    alert('请选择 .mp3 文件');
    return;
  }
  files.forEach(f => {
    if (!pendingFiles.some(x => x.name === f.name && x.size === f.size)) pendingFiles.push(f);
  });
  renderPendingFiles();
}

function renderPendingFiles() {
  const ul = document.getElementById('uploadFileList');
  ul.innerHTML = pendingFiles.map((f, i) => `
    <li class="sel-item" style="cursor:default;">
      <div class="sel-info">
        <div class="sel-name">${escapeHtml(f.name)}</div>
        <div class="sel-path">${(f.size / 1024 / 1024).toFixed(2)} MB</div>
      </div>
      <button class="btn-more" data-idx="${i}" title="移除">✕</button>
    </li>
  `).join('');

  ul.querySelectorAll('button[data-idx]').forEach(b => {
    b.addEventListener('click', () => {
      pendingFiles.splice(parseInt(b.dataset.idx), 1);
      renderPendingFiles();
    });
  });

  const btn = document.getElementById('doUploadBtn');
  btn.disabled = pendingFiles.length === 0;
  btn.textContent = pendingFiles.length ? `开始上传（${pendingFiles.length} 个文件）` : '开始上传';
}

document.getElementById('doUploadBtn').addEventListener('click', async () => {
  if (pendingFiles.length === 0) return;

  // 如果没有 Token，或者 Token 失效了，弹窗让用户输入
  if (!getGitHubToken()) {
    alert('必须提供 Token 才能上传！');
    return;
  }

  const dir = document.getElementById('uploadDir').value.trim();
  const btn = document.getElementById('doUploadBtn');
  const log = document.getElementById('uploadLog');

  btn.disabled = true;
  log.classList.add('show');
  log.innerHTML = '';
  logLine(log, `准备上传 ${pendingFiles.length} 个文件 → ${dir || '仓库根目录'}`, 'info');

  let ok = 0, fail = 0;
  const uploaded = [];

  for (const file of pendingFiles) {
    logLine(log, `正在上传：${file.name} ...`, 'info');
    try {
      const path = await ghUpload(file, dir);
      uploaded.push({ file, path });
      ok++;
      logLine(log, `✔ 已上传：${path}`, 'ok');
    } catch (err) {
      fail++;
      logLine(log, `✘ 失败：${file.name}（${err.message}）`, 'err');
      if (err.message.includes('401') || err.message.includes('Bad credentials')) {
        logLine(log, `⚠️ Token 无效或已过期，请重新点击上传并输入新 Token`, 'err');
        btn.disabled = false;
        return;
      }
    }
  }

  // 本地补进列表（无需重新请求）
  const baseUrl = `https://${CONFIG.owner}.github.io/${CONFIG.repo}/`;
  uploaded.forEach(({ path }) => {
    if (allSongs.some(s => s.path === path)) return;
    allSongs.push({
      name: path.split('/').pop().replace(/\.mp3$/i, ''),
      path,
      url: baseUrl + path.split('/').map(encodeURIComponent).join('/'),
      sha: null
    });
  });

  localStorage.setItem('mp_song_order', JSON.stringify(allSongs.map(s => s.path)));
  updateTagSelect();
  renderPlaylist();

  logLine(log, `—— 完成：成功 ${ok}，失败 ${fail} ——`, ok > 0 ? 'ok' : 'err');
  if (ok > 0) logLine(log, '提示：GitHub Pages 需要 1~2 分钟部署，新歌才会可播放。', 'info');

  pendingFiles = [];
  renderPendingFiles();
  btn.disabled = pendingFiles.length === 0;
});

/* ---------- 2. 删除曲目 ---------- */
document.getElementById('doDeleteBtn').addEventListener('click', async () => {
  const paths = Array.from(selectState.del);
  if (paths.length === 0) return;

  if (!confirm(`确定删除选中的 ${paths.length} 首歌曲吗？\n\n⚠️ 这会同时删除 GitHub 仓库中的音频文件，不可恢复！`)) return;

  if (!getGitHubToken()) {
    alert('必须提供 Token 才能删除！');
    return;
  }

  const btn = document.getElementById('doDeleteBtn');
  const log = document.getElementById('deleteLog');
  btn.disabled = true;
  log.classList.add('show');
  log.innerHTML = '';

  let ok = 0, fail = 0;

  for (const path of paths) {
    const song = allSongs.find(s => s.path === path);
    logLine(log, `正在删除：${path} ...`, 'info');
    try {
      let sha = song && song.sha;
      if (!sha) sha = await ghGetSha(path);
      await ghDelete(path, sha);

      allSongs = allSongs.filter(s => s.path !== path);
      delete songTagsMap[path];
      ok++;
      logLine(log, `✔ 已删除：${path}`, 'ok');
    } catch (err) {
      fail++;
      logLine(log, `✘ 失败：${path}（${err.message}）`, 'err');
      if (err.message.includes('401') || err.message.includes('Bad credentials')) {
        logLine(log, `⚠️ Token 无效或已过期，请重新点击删除并输入新 Token`, 'err');
        btn.disabled = false;
        return;
      }
    }
  }

  localStorage.setItem('mp_song_tags', JSON.stringify(songTagsMap));
  localStorage.setItem('mp_song_order', JSON.stringify(allSongs.map(s => s.path)));

  logLine(log, `—— 完成：成功 ${ok}，失败 ${fail} ——`, ok > 0 ? 'ok' : 'err');

  selectState.del.clear();
  renderSelList('del');
  updateTagSelect();
  renderPlaylist();
  btn.disabled = true;
});

/* ---------- 3. 缓存曲目 ---------- */
document.getElementById('doCacheBtn').addEventListener('click', async () => {
  const paths = Array.from(selectState.cache);
  if (paths.length === 0) return;

  const btn = document.getElementById('doCacheBtn');
  const log = document.getElementById('cacheLog');
  btn.disabled = true;
  log.classList.add('show');
  log.innerHTML = '';
  logLine(log, `开始缓存 ${paths.length} 首歌曲...`, 'info');

  let ok = 0, fail = 0;

  for (const path of paths) {
    const song = allSongs.find(s => s.path === path);
    if (!song) continue;
    logLine(log, `正在下载：${song.name} ...`, 'info');
    try {
      await downloadSongFile(song);
      ok++;
      logLine(log, `✔ 已下载：${song.name}`, 'ok');
      await new Promise(r => setTimeout(r, 400)); // 防止浏览器拦截连续下载
    } catch (err) {
      fail++;
      logLine(log, `✘ 失败：${song.name}（${err.message}）`, 'err');
    }
  }

  logLine(log, `—— 完成：成功 ${ok}，失败 ${fail} ——`, ok > 0 ? 'ok' : 'err');
  btn.disabled = selectState.cache.size === 0;
});

async function downloadSongFile(song) {
  const fileName = song.name + '.mp3';
  try {
    const res = await fetch(song.url, { cache: 'force-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
  } catch (e) {
    const a = document.createElement('a');
    a.href = song.url;
    a.download = fileName;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
}

/* ---------- 4. 批量标签 ---------- */
function refreshTagPickSelect() {
  const sel = document.getElementById('tagPickSelect');
  if (globalTags.length === 0) {
    sel.innerHTML = '<option value="">（暂无已有标签）</option>';
    return;
  }
  sel.innerHTML = globalTags.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
}

function getPickedTag() {
  const inputVal = document.getElementById('tagPickInput').value.trim();
  if (inputVal) return inputVal;
  return document.getElementById('tagPickSelect').value || '';
}

document.getElementById('applyTagBtn').addEventListener('click', () => {
  const tag = getPickedTag();
  const log = document.getElementById('tagLog');

  if (!tag) { alert('请先选择或输入一个标签'); return; }
  const paths = Array.from(selectState.tag);
  if (paths.length === 0) { alert('请先勾选要操作的曲目'); return; }

  if (!globalTags.includes(tag)) {
    globalTags.push(tag);
    localStorage.setItem('mp_tags_pool', JSON.stringify(globalTags));
    updateTagSelect();
    refreshTagPickSelect();
  }

  paths.forEach(p => {
    if (!songTagsMap[p]) songTagsMap[p] = [];
    if (!songTagsMap[p].includes(tag)) songTagsMap[p].push(tag);
  });
  localStorage.setItem('mp_song_tags', JSON.stringify(songTagsMap));

  renderPlaylist();
  renderSelList('tag');

  log.classList.add('show');
  log.innerHTML = '';
  logLine(log, `✔ 已为 ${paths.length} 首歌曲添加标签「${tag}」`, 'ok');
});

document.getElementById('removeTagBtn').addEventListener('click', () => {
  const tag = getPickedTag();
  const log = document.getElementById('tagLog');

  if (!tag) { alert('请先选择或输入一个标签'); return; }
  const paths = Array.from(selectState.tag);
  if (paths.length === 0) { alert('请先勾选要操作的曲目'); return; }

  let count = 0;
  paths.forEach(p => {
    if (songTagsMap[p] && songTagsMap[p].includes(tag)) {
      songTagsMap[p] = songTagsMap[p].filter(t => t !== tag);
      count++;
    }
  });
  localStorage.setItem('mp_song_tags', JSON.stringify(songTagsMap));

  renderPlaylist();
  renderSelList('tag');

  log.classList.add('show');
  log.innerHTML = '';
  logLine(log, `✔ 已从 ${count} 首歌曲移除标签「${tag}」`, 'ok');
});

/* =========================================================
   初始化
   ========================================================= */
updateTagSelect();
refreshTagPickSelect();
fetchSongs();
</script>
