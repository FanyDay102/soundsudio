<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>沉浸式音乐播放器</title>
<style>
  :root {
    --primary: #ef4444; /* 醒目红色 */
    --primary-dark: #dc2626;
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
    --bg-color: #0f172a;
    --glass-bg: rgba(30, 41, 59, 0.65);
    --glass-border: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
  }

  /* ================= 整体布局 ================= */
  .main-container {
    width: 100%;
    max-width: 1050px;
    height: 100%;
    max-height: 900px;
    display: flex;
    gap: 0;
    position: relative;
    overflow: hidden;
  }

  /* 模糊背景层 */
  .bg-blur {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-size: cover;
    background-position: center;
    filter: blur(40px) brightness(0.4);
    z-index: -1;
    transform: scale(1.2);
    transition: background-image 0.5s;
  }

  /* ================= 左侧：沉浸式播放页 ================= */
  .player-page {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px 40px;
    position: relative;
    z-index: 10;
    height: 100%;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  /* 顶部导航 */
  .player-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 48px;
    margin-bottom: 20px;
  }
  .nav-icon {
    color: var(--text-main);
    font-size: 20px;
    cursor: pointer;
    opacity: 0.8;
    width: 32px;
    height: 32px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
  }
  .nav-icon:hover { background: rgba(255,255,255,0.1); opacity: 1; }
  .url-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 6px 16px;
    border-radius: 20px;
    color: var(--text-main);
    text-decoration: none;
    font-size: 13px;
    transition: all 0.2s;
  }
  .url-btn:hover { background: rgba(255,255,255,0.2); }

  /* 封面区域 */
  .cover-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }
  .cover-img {
    width: 280px;
    height: 280px;
    border-radius: 24px;
    object-fit: cover;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    transition: transform 0.3s;
    z-index: 2;
  }
  
  /* 歌词容器 */
  .lyrics-container {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: auto;
    text-align: center;
    padding: 40% 20px;
    mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
    scroll-behavior: smooth;
    z-index: 1;
  }
  .lyrics-container::-webkit-scrollbar { display: none; }
  
  .lyric-line {
    font-size: 16px;
    color: rgba(255,255,255,0.4);
    line-height: 2.2;
    transition: all 0.3s;
    cursor: pointer;
    padding: 4px 0;
    transform-origin: center;
  }
  .lyric-line.active {
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    transform: scale(1.05);
    text-shadow: 0 2px 10px rgba(255,255,255,0.3);
  }
  .no-lyrics { font-size: 14px; color: var(--text-sub); margin-top: 20px; }

  /* 歌曲信息 */
  .song-meta {
    text-align: center;
    margin-top: 20px;
    padding: 0 10px;
  }
  .song-title-lg {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .song-artist-lg {
    font-size: 14px;
    color: var(--text-sub);
  }

  /* 进度条 */
  .progress-area {
    margin-top: 30px;
    width: 100%;
  }
  .time-wrap {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 10px;
    font-variant-numeric: tabular-nums;
  }
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    background: transparent;
    cursor: pointer;
  }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.15);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 12px;
    width: 12px;
    border-radius: 50%;
    background: #fff;
    margin-top: -4px;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
    transition: transform 0.1s;
  }
  input[type=range]:active::-webkit-slider-thumb { transform: scale(1.3); }
  #progress::-webkit-slider-runnable-track {
    background: linear-gradient(to right, #fff var(--p,0%), rgba(255,255,255,0.15) var(--p,0%));
  }

  /* 控制栏 */
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 30px;
    margin-bottom: 10px;
    padding: 0 10px;
  }
  .btn-icon {
    background: none;
    border: none;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    opacity: 0.7;
    transition: 0.2s;
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
  }
  .btn-icon:hover { opacity: 1; background: rgba(255,255,255,0.1); }
  .btn-icon.active { color: var(--primary); opacity: 1; }
  
  .btn-play-main {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--primary);
    border: none;
    color: #fff;
    font-size: 28px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
    transition: transform 0.1s, background 0.2s;
  }
  .btn-play-main:hover { background: var(--primary-dark); transform: scale(1.05); }
  .btn-play-main:active { transform: scale(0.95); }

  /* ================= 右侧：列表页 ================= */
  .list-page {
    flex: 0 0 400px;
    background: var(--glass-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-left: 1px solid var(--glass-border);
    display: flex;
    flex-direction: column;
    height: 100%;
    z-index: 20;
    transition: transform 0.3s ease-in-out;
  }

  .list-header {
    padding: 24px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .header-top h2 { font-size: 18px; font-weight: 600; }
  .header-top span { font-size: 13px; color: var(--text-sub); font-weight: 400; }

  .tag-manager {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .tag-select {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.2);
    color: #fff;
    outline: none;
    font-size: 13px;
    cursor: pointer;
  }
  .tag-select option { background: #1e293b; color: #fff; }
  
  .tag-input-wrap { display: flex; gap: 6px; margin-left: auto; }
  .tag-input {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.2);
    color: #fff;
    outline: none;
    font-size: 12px;
    width: 90px;
  }
  .tag-input:focus { border-color: var(--primary); }
  .btn-add-tag {
    padding: 6px 12px;
    border-radius: 8px;
    border: none;
    background: var(--primary);
    color: white;
    font-size: 12px;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-add-tag:hover { background: var(--primary-dark); }

  .playlist {
    list-style: none;
    overflow-y: auto;
    flex: 1;
    padding: 12px;
  }
  .playlist::-webkit-scrollbar { width: 4px; }
  .playlist::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

  .track-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s;
    margin-bottom: 4px;
  }
  .track-item:hover { background: rgba(255,255,255,0.05); }
  .track-item.active { background: rgba(239, 68, 68, 0.15); }
  .track-item.active .track-name { color: var(--primary); font-weight: 700; }
  
  .track-item.dragging { opacity: 0.5; background: rgba(255,255,255,0.1); }
  .track-item.drag-over { border-top: 2px solid var(--primary); }

  .track-icon {
    width: 44px; height: 44px;
    border-radius: 8px;
    object-fit: cover;
    background: #1e293b;
    flex-shrink: 0;
  }

  .track-info { flex: 1; min-width: 0; }
  .track-name {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-path {
    font-size: 11px;
    color: var(--text-sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .song-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .mini-tag {
    font-size: 10px;
    background: rgba(239,68,68,0.2);
    color: #fca5a5;
    padding: 2px 6px;
    border-radius: 4px;
  }

  .playing-indicator { display: none; gap: 3px; align-items: flex-end; height: 12px; margin-right: 4px; }
  .track-item.active .playing-indicator { display: flex; }
  .playing-indicator i {
    display: block; width: 2px; background: var(--primary);
    border-radius: 1px; animation: eq 1s infinite ease-in-out;
  }
  .playing-indicator i:nth-child(1) { height: 60%; animation-delay: 0s; }
  .playing-indicator i:nth-child(2) { height: 100%; animation-delay: -0.2s; }
  .playing-indicator i:nth-child(3) { height: 40%; animation-delay: -0.4s; }
  @keyframes eq { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }

  .btn-more {
    background: none; border: none; font-size: 20px;
    color: var(--text-sub); cursor: pointer; padding: 0 6px;
    line-height: 1; transition: 0.2s;
  }
  .btn-more:hover { color: #fff; }

  /* ================= 菜单 ================= */
  .context-menu {
    position: fixed;
    background: #1e293b;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    padding: 8px;
    min-width: 160px;
    z-index: 1000;
    display: none;
  }
  .menu-item {
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #e2e8f0;
  }
  .menu-item:hover { background: rgba(255,255,255,0.1); }
  .menu-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 6px 0; }
  .menu-title { font-size: 11px; color: var(--text-sub); padding: 4px 12px; }
  .menu-tag-label {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; font-size: 13px; cursor: pointer; border-radius: 6px;
  }
  .menu-tag-label:hover { background: rgba(255,255,255,0.1); }
  .menu-tag-label input { accent-color: var(--primary); }

  /* ================= 移动端适配 ================= */
  .mobile-overlay {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 60vh;
    background: var(--glass-bg);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    z-index: 50;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
  }
  
  @media (max-width: 768px) {
    body { padding: 0; align-items: flex-start; }
    .main-container { flex-direction: column; height: 100dvh; }
    
    .player-page {
      padding: 20px;
      padding-top: 10px;
      flex: 1;
      background: transparent;
      backdrop-filter: none;
      display: flex;
      flex-direction: column;
    }
    
    .player-nav { margin-bottom: 10px; }
    .cover-area { 
      flex: 1; 
      min-height: 300px; 
      justify-content: flex-start; 
      padding-top: 20px;
    }
    .cover-img { width: 220px; height: 220px; border-radius: 16px; }
    
    /* 移动端歌词区域调整 */
    .lyrics-container { padding: 45% 20px; }
    .lyric-line { font-size: 15px; line-height: 2; }
    .lyric-line.active { font-size: 18px; }

    .song-meta { margin-top: 15px; }
    .song-title-lg { font-size: 20px; }
    
    .progress-area { margin-top: 20px; }
    .controls { margin-top: 15px; margin-bottom: 10px; }
    .btn-play-main { width: 56px; height: 56px; font-size: 24px; }
    
    /* 隐藏桌面端列表，改用弹出层 */
    .list-page { display: none; }
    
    /* 移动端弹出列表 */
    .mobile-overlay.active { transform: translateY(0); }
    .mobile-list-header { 
      padding: 20px 20px 10px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
    }
    .mobile-list-header h2 { font-size: 16px; }
    .btn-close-overlay { 
      background: rgba(255,255,255,0.1); 
      border: none; color: #fff; 
      width: 30px; height: 30px; border-radius: 50%; 
      font-size: 16px; display: grid; place-items: center; cursor: pointer;
    }
    .mobile-list-content { flex: 1; overflow-y: auto; padding: 0 12px 20px; }
  }
</style>
</head>
<body>

<div class="main-container">
  <!-- 动态模糊背景 -->
  <div class="bg-blur" id="bgBlur"></div>

  <!-- ================= 播放页 (左侧/全屏) ================= -->
  <section class="player-page">
    <div class="player-nav">
      <div class="nav-icon" id="mobileListBtn" title="播放列表">≡</div>
      <a href="https://y2mate.gs/" target="_blank" class="url-btn">🔗 转换器</a>
      <div class="nav-icon" style="opacity:0;">⋮</div>
    </div>

    <div class="cover-area">
      <!-- 封面 -->
      <img class="cover-img" id="mainCover" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="cover">
      
      <!-- 滚动歌词 -->
      <div class="lyrics-container" id="lyricsContainer">
        <div class="no-lyrics">暂无歌词</div>
      </div>
    </div>

    <div class="song-meta">
      <div class="song-title-lg" id="songTitle">等待读取...</div>
      <div class="song-artist-lg" id="songArtist">请点击播放</div>
    </div>

    <div class="progress-area">
      <div class="time-wrap">
        <span id="curTime">0:00</span>
        <span id="durTime">0:00</span>
      </div>
      <input type="range" id="progress" min="0" max="1000" value="0" disabled>
    </div>

    <div class="controls">
      <button class="btn-icon active" id="modeBtn" title="列表循环">🔁</button>
      <button class="btn-icon" id="prevBtn">⏮</button>
      <button class="btn-play-main" id="playBtn">▶</button>
      <button class="btn-icon" id="nextBtn">⏭</button>
      <button class="btn-icon" id="shuffleBtn" title="随机播放">🔀</button>
    </div>
  </section>

  <!-- ================= 列表页 (右侧/桌面端) ================= -->
  <section class="list-page">
    <div class="list-header">
      <div class="header-top">
        <h2>播放列表 <span id="songCount">(0)</span></h2>
      </div>
      <div class="tag-manager">
        <select class="tag-select" id="filterSelect">
          <option value="">🎵 全部歌曲</option>
        </select>
        <div class="tag-input-wrap">
          <input type="text" class="tag-input" id="newTagInput" placeholder="新标签...">
          <button class="btn-add-tag" id="addTagBtn">创建</button>
        </div>
      </div>
    </div>
    <ul class="playlist" id="playlistDesktop">
      <li style="padding:20px; text-align:center; color:#94a3b8;">加载中...</li>
    </ul>
  </section>

  <!-- ================= 列表页 (移动端底部弹层) ================= -->
  <div class="mobile-overlay" id="mobileOverlay">
    <div class="mobile-list-header">
      <h2>播放列表 <span id="songCountMobile" style="font-size:12px; color:#94a3b8; font-weight:400;">(0)</span></h2>
      <button class="btn-close-overlay" id="closeOverlayBtn">✕</button>
    </div>
    <div class="mobile-list-content">
      <ul class="playlist" id="playlistMobile"></ul>
    </div>
  </div>
</div>

<!-- 悬浮菜单 -->
<div class="context-menu" id="contextMenu">
  <div class="menu-item" id="downloadBtn">⬇️ 下载歌曲</div>
  <div class="menu-divider"></div>
  <div class="menu-title">管理标签</div>
  <div class="menu-tags" id="menuTags"></div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
/* =========================================================
   配置与状态
   ========================================================= */
const CONFIG = {
  owner: 'FanyDay102',
  repo: 'soundsudio',
  branch: 'main'
};

let allSongs = [];
let displaySongs = [];
let currentIndex = -1;
let isPlaying = false;
let repeatMode = 'all'; // 'all', 'one', 'off'
let isShuffle = false;

// 歌词相关
let currentLyrics = []; 
let activeLyricIndex = -1;

// 本地存储数据
let globalTags = JSON.parse(localStorage.getItem('mp_tags_pool') || '[]');
let songTagsMap = JSON.parse(localStorage.getItem('mp_song_tags') || '{}');
let savedOrder = JSON.parse(localStorage.getItem('mp_song_order') || '[]');

// DOM
const audio = document.getElementById('audio');
const bgBlur = document.getElementById('bgBlur');
const mainCover = document.getElementById('mainCover');
const lyricsContainer = document.getElementById('lyricsContainer');
const songTitle = document.getElementById('songTitle');
const songArtist = document.getElementById('songArtist');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const modeBtn = document.getElementById('modeBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const progress = document.getElementById('progress');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');
const filterSelect = document.getElementById('filterSelect');
const newTagInput = document.getElementById('newTagInput');
const addTagBtn = document.getElementById('addTagBtn');
const songCount = document.getElementById('songCount');
const songCountMobile = document.getElementById('songCountMobile');
const playlistDesktop = document.getElementById('playlistDesktop');
const playlistMobile = document.getElementById('playlistMobile');
const contextMenu = document.getElementById('contextMenu');
const downloadBtn = document.getElementById('downloadBtn');
const menuTags = document.getElementById('menuTags');

// 移动端列表控制
const mobileListBtn = document.getElementById('mobileListBtn');
const mobileOverlay = document.getElementById('mobileOverlay');
const closeOverlayBtn = document.getElementById('closeOverlayBtn');
if (window.innerWidth <= 768) mobileListBtn.style.display = 'flex';

mobileListBtn.addEventListener('click', () => mobileOverlay.classList.add('active'));
closeOverlayBtn.addEventListener('click', () => mobileOverlay.classList.remove('active'));

let activeMenuPath = '';

/* =========================================================
   封面生成
   ========================================================= */
function getCoverUrl(seed) {
  return `https://picsum.photos/seed/${encodeURIComponent(seed)}/500/500`;
}

/* =========================================================
   核心：获取歌词 (LRCLIB API)
   ========================================================= */
async function fetchLyrics(songName) {
  lyricsContainer.innerHTML = '<div class="no-lyrics">正在匹配歌词...</div>';
  currentLyrics = [];
  activeLyricIndex = -1;

  // 1. 智能解析文件名：假设格式为 "歌手 - 歌名" 或 "歌名"
  let title = songName;
  let artist = '';
  
  if (songName.includes(' - ')) {
    const parts = songName.split(' - ');
    artist = parts[0].trim();
    title = parts[1].trim();
  }

  try {
    // 优先使用精确匹配接口
    let apiUrl = `https://lrclib.net/api/get?track_name=${encodeURIComponent(title)}`;
    if (artist) apiUrl += `&artist_name=${encodeURIComponent(artist)}`;
    
    let res = await fetch(apiUrl, {
      headers: { 'Lrclib-Client': 'MyHTMLMusicPlayer v1.0' }
    });

    // 如果精确匹配失败，退回到搜索接口
    if (res.status === 404) {
      const query = artist ? `${title} ${artist}` : title;
      apiUrl = `https://lrclib.net/api/search?q=${encodeURIComponent(query)}`;
      res = await fetch(apiUrl, {
        headers: { 'Lrclib-Client': 'MyHTMLMusicPlayer v1.0' }
      });
    }

    if (!res.ok) throw new Error('未找到歌词');

    const data = await res.json();
    const result = Array.isArray(data) ? data[0] : data;

    if (!result || !result.syncedLyrics) {
      lyricsContainer.innerHTML = '<div class="no-lyrics">纯音乐 / 暂无同步歌词</div>';
      return;
    }

    // 解析 LRC 歌词文本
    parseLRC(result.syncedLyrics);
    
    // 更新界面歌手信息
    if (result.artistName) {
      songArtist.textContent = result.artistName;
    }

  } catch (error) {
    console.warn('歌词获取失败:', error);
    lyricsContainer.innerHTML = '<div class="no-lyrics">暂无歌词</div>';
  }
}

// 解析 LRC 格式
function parseLRC(lrcText) {
  const lines = lrcText.split('\n');
  const result = [];
  const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;

  lines.forEach(line => {
    const match = line.match(timeReg);
    if (match) {
      const min = parseInt(match[1]);
      const sec = parseInt(match[2]);
      const ms = parseInt(match[3].padEnd(3, '0'));
      const time = min * 60 + sec + ms / 1000;
      const text = match[4].trim();
      if (text) result.push({ time, text });
    }
  });

  currentLyrics = result;

  if (currentLyrics.length === 0) {
    lyricsContainer.innerHTML = '<div class="no-lyrics">无歌词内容</div>';
    return;
  }

  // 渲染到 DOM
  lyricsContainer.innerHTML = currentLyrics.map((lyric, index) => `
    <div class="lyric-line" data-index="${index}" onclick="seekToLyric(${lyric.time})">
      ${lyric.text}
    </div>
  `).join('');
}

window.seekToLyric = function(time) {
  if (audio.duration) {
    audio.currentTime = time;
  }
};

// 核心：同步滚动高亮
function syncLyrics(currentTime) {
  if (currentLyrics.length === 0) return;

  let newIndex = -1;
  for (let i = 0; i < currentLyrics.length; i++) {
    if (currentTime >= currentLyrics[i].time) {
      newIndex = i;
    } else {
      break;
    }
  }

  if (newIndex !== -1 && newIndex !== activeLyricIndex) {
    activeLyricIndex = newIndex;
    
    const lineEls = lyricsContainer.querySelectorAll('.lyric-line');
    lineEls.forEach((el, idx) => {
      if (idx === newIndex) {
        el.classList.add('active');
        // 平滑滚动至中央
        const containerHeight = lyricsContainer.clientHeight;
        const elOffset = el.offsetTop;
        const elHeight = el.clientHeight;
        lyricsContainer.scrollTo({
          top: elOffset - containerHeight / 2 + elHeight / 2,
          behavior: 'smooth'
        });
      } else {
        el.classList.remove('active');
      }
    });
  }
}

/* =========================================================
   数据请求与列表渲染
   ========================================================= */
async function fetchSongs() {
  const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${CONFIG.branch}?recursive=1`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('读取失败');
    const data = await res.json();

    const baseUrl = `https://${CONFIG.owner}.github.io/${CONFIG.repo}/`;
    const mp3Files = data.tree.filter(item => item.type === 'blob' && item.path.toLowerCase().endsWith('.mp3'));

    if (mp3Files.length === 0) {
      playlistDesktop.innerHTML = '<li style="padding:20px;text-align:center;color:#94a3b8;">仓库中没有 mp3 文件</li>';
      return;
    }

    allSongs = mp3Files.map(file => {
      const fileName = file.path.split('/').pop();
      const encodedPath = file.path.split('/').map(encodeURIComponent).join('/');
      return {
        name: fileName.replace(/\.mp3$/i, ''),
        path: file.path,
        url: baseUrl + encodedPath
      };
    });

    applySavedOrder();
    updateTagSelect();
    renderPlaylist();
    
    songTitle.textContent = '准备就绪';
    songArtist.textContent = '点击列表开始播放';
    
  } catch (error) {
    console.error(error);
    playlistDesktop.innerHTML = `<li style="padding:20px;text-align:center;color:#ef4444;">❌ 读取失败: ${error.message}</li>`;
  }
}

function applySavedOrder() {
  if (savedOrder.length === 0) return;
  allSongs.sort((a, b) => {
    const iA = savedOrder.indexOf(a.path);
    const iB = savedOrder.indexOf(b.path);
    if (iA !== -1 && iB !== -1) return iA - iB;
    if (iA !== -1) return -1;
    if (iB !== -1) return 1;
    return 0;
  });
}

function updateTagSelect() {
  const currentVal = filterSelect.value;
  filterSelect.innerHTML = '<option value="">🎵 全部歌曲</option>' + 
    globalTags.map(tag => `<option value="${tag}">${tag}</option>`).join('');
  if (globalTags.includes(currentVal)) filterSelect.value = currentVal;
}

filterSelect.addEventListener('change', renderPlaylist);

addTagBtn.addEventListener('click', () => {
  const val = newTagInput.value.trim();
  if (!val) return;
  if (globalTags.includes(val)) { alert('标签已存在'); return; }
  globalTags.push(val);
  localStorage.setItem('mp_tags_pool', JSON.stringify(globalTags));
  newTagInput.value = '';
  updateTagSelect();
});

function renderPlaylist() {
  const filterTag = filterSelect.value;

  displaySongs = allSongs.filter(song => {
    if (!filterTag) return true;
    const tags = songTagsMap[song.path] || [];
    return tags.includes(filterTag);
  });

  songCount.textContent = `(${displaySongs.length})`;
  songCountMobile.textContent = `(${displaySongs.length})`;

  if (displaySongs.length === 0) {
    const emptyHtml = '<li style="padding:20px;text-align:center;color:#94a3b8;">没有符合条件的歌曲</li>';
    playlistDesktop.innerHTML = emptyHtml;
    playlistMobile.innerHTML = emptyHtml;
    return;
  }

  const html = displaySongs.map((song, index) => {
    const isActive = index === currentIndex ? 'active' : '';
    const tags = songTagsMap[song.path] || [];
    const tagHtml = tags.map(t => `<span class="mini-tag">${t}</span>`).join('');
    const cover = getCoverUrl(song.path);

    return `
      <li class="track-item ${isActive}" draggable="true" data-index="${index}" data-path="${song.path}">
        <img class="track-icon" src="${cover}" loading="lazy" alt="cover">
        <div class="track-info">
          <div class="track-name">${song.name}</div>
          <div class="track-path">${song.path}</div>
          <div class="song-tags">${tagHtml}</div>
        </div>
        <div class="playing-indicator"><i></i><i></i><i></i></div>
        <button class="btn-more" onclick="openMenu(event, '${song.path.replace(/'/g, "\\'")}')">⋮</button>
      </li>
    `;
  }).join('');

  playlistDesktop.innerHTML = html;
  playlistMobile.innerHTML = html;

  bindDragEvents();
  
  if (currentIndex >= 0 && currentIndex < displaySongs.length) {
    // 滚动到可视区域
    setTimeout(() => {
      const activeItems = document.querySelectorAll('.track-item.active');
      activeItems.forEach(item => item.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
    }, 100);
  }
}

/* =========================================================
   菜单与标签
   ========================================================= */
window.openMenu = function(e, path) {
  e.stopPropagation();
  activeMenuPath = path;
  const currentTags = songTagsMap[path] || [];

  if (globalTags.length === 0) {
    menuTags.innerHTML = '<div style="padding:10px; font-size:12px; color:#999;">暂无标签</div>';
  } else {
    menuTags.innerHTML = globalTags.map(tag => `
      <label class="menu-tag-label">
        <input type="checkbox" value="${tag}" ${currentTags.includes(tag) ? 'checked' : ''} 
               onchange="toggleSongTag('${path.replace(/'/g, "\\'")}', '${tag}', this.checked)">
        ${tag}
      </label>
    `).join('');
  }

  const rect = e.target.getBoundingClientRect();
  contextMenu.style.display = 'block';
  
  let top = rect.bottom + 5;
  if (top + contextMenu.offsetHeight > window.innerHeight) {
    top = rect.top - contextMenu.offsetHeight - 5;
  }
  let left = rect.left - 100;
  if (left + contextMenu.offsetWidth > window.innerWidth) {
    left = window.innerWidth - contextMenu.offsetWidth - 10;
  }

  contextMenu.style.top = top + 'px';
  contextMenu.style.left = left + 'px';
}

document.addEventListener('click', () => {
  contextMenu.style.display = 'none';
});

window.toggleSongTag = function(path, tag, isChecked) {
  if (!songTagsMap[path]) songTagsMap[path] = [];
  if (isChecked) {
    if (!songTagsMap[path].includes(tag)) songTagsMap[path].push(tag);
  } else {
    songTagsMap[path] = songTagsMap[path].filter(t => t !== tag);
  }
  localStorage.setItem('mp_song_tags', JSON.stringify(songTagsMap));
  renderPlaylist();
}

downloadBtn.addEventListener('click', () => {
  const song = allSongs.find(s => s.path === activeMenuPath);
  if (song) {
    const a = document.createElement('a');
    a.href = song.url;
    a.download = song.name + '.mp3';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
});

/* =========================================================
   拖拽排序
   ========================================================= */
let draggedItem = null;

function bindDragEvents() {
  const items = document.querySelectorAll('.track-item');
  items.forEach(item => {
    item.addEventListener('dragstart', (e) => {
      draggedItem = item;
      setTimeout(() => item.classList.add('dragging'), 0);
    });
    
    item.addEventListener('dragend', () => {
      if (!draggedItem) return;
      draggedItem.classList.remove('dragging');
      draggedItem = null;
      saveNewOrder();
    });
    
    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (!draggedItem || draggedItem === item) return;
      
      const rect = item.getBoundingClientRect();
      const offset = e.clientY - rect.top;
      
      if (offset > rect.height / 2) {
        item.parentNode.insertBefore(draggedItem, item.nextSibling);
      } else {
        item.parentNode.insertBefore(draggedItem, item);
      }
    });
  });
}

function saveNewOrder() {
  const container = document.querySelector('.playlist'); // 用任一个即可
  if (!container) return;
  const newPaths = Array.from(container.querySelectorAll('.track-item')).map(li => li.dataset.path);
  
  allSongs.sort((a, b) => {
    const iA = newPaths.indexOf(a.path);
    const iB = newPaths.indexOf(b.path);
    if (iA !== -1 && iB !== -1) return iA - iB;
    if (iA !== -1) return -1;
    if (iB !== -1) return 1;
    return 0;
  });
  localStorage.setItem('mp_song_order', JSON.stringify(allSongs.map(s => s.path)));
}

/* =========================================================
   播放核心逻辑
   ========================================================= */
function loadSong(index, autoPlay = true) {
  if (index < 0 || index >= displaySongs.length) return;
  
  if (currentIndex === index && audio.src === displaySongs[index].url) {
    if (isPlaying) audio.pause();
    else audio.play();
    return;
  }

  currentIndex = index;
  const song = displaySongs[index];

  songTitle.textContent = song.name;
  songArtist.textContent = song.path;
  document.title = `${song.name} - 音乐播放器`;

  const coverUrl = getCoverUrl(song.path);
  mainCover.src = coverUrl;
  bgBlur.style.backgroundImage = `url('${coverUrl}')`;

  // 更新 UI 激活状态
  document.querySelectorAll('.track-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll(`.track-item[data-index="${index}"]`).forEach(el => el.classList.add('active'));

  audio.src = song.url;
  
  // 触发歌词检索
  fetchLyrics(song.name);

  // 后台媒体控制
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.name,
      artist: '我的音乐收藏',
      artwork: [{ src: coverUrl, sizes: '500x500', type: 'image/jpeg' }]
    });
    navigator.mediaSession.setActionHandler('play', () => audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', () => handleNextPrev('prev'));
    navigator.mediaSession.setActionHandler('nexttrack', () => handleNextPrev('next'));
  }

  if (autoPlay) {
    audio.play().catch(err => {
      console.warn('播放被拦截', err);
      isPlaying = false;
      updatePlayBtnUI();
    });
  }
}

function playAudio() {
  if (currentIndex === -1 && displaySongs.length > 0) {
    loadSong(isShuffle ? getRandomIndex() : 0);
  } else {
    audio.play();
  }
}

function pauseAudio() { audio.pause(); }

function updatePlayBtnUI() {
  playBtn.textContent = isPlaying ? '⏸' : '▶';
}

function getNextIndex() {
  if (displaySongs.length === 0) return -1;
  if (displaySongs.length === 1) return 0;
  if (isShuffle) return getRandomIndex();
  if (currentIndex === displaySongs.length - 1) {
    if (repeatMode === 'off') return -1;
    return 0;
  }
  return currentIndex + 1;
}

function getRandomIndex() {
  if (displaySongs.length <= 1) return 0;
  let newIndex;
  do { newIndex = Math.floor(Math.random() * displaySongs.length); } while (newIndex === currentIndex);
  return newIndex;
}

function handleNextPrev(direction) {
  if (displaySongs.length === 0) return;
  if (direction === 'next') {
    const nextIdx = getNextIndex();
    if (nextIdx === -1) {
      audio.pause(); audio.currentTime = 0;
      isPlaying = false; updatePlayBtnUI();
    } else {
      loadSong(nextIdx);
    }
  } else {
    let prevIdx = isShuffle ? getRandomIndex() : currentIndex - 1;
    if (prevIdx < 0) prevIdx = displaySongs.length - 1;
    loadSong(prevIdx);
  }
}

/* =========================================================
   事件监听
   ========================================================= */
[playlistDesktop, playlistMobile].forEach(pl => {
  if (!pl) return;
  pl.addEventListener('click', (e) => {
    if (e.target.closest('.btn-more')) return;
    const li = e.target.closest('.track-item');
    if (!li) return;
    const index = parseInt(li.dataset.index);
    loadSong(index);
  });
});

playBtn.addEventListener('click', () => { isPlaying ? pauseAudio() : playAudio(); });
prevBtn.addEventListener('click', () => handleNextPrev('prev'));
nextBtn.addEventListener('click', () => handleNextPrev('next'));

modeBtn.addEventListener('click', () => {
  if (repeatMode === 'all') { repeatMode = 'one'; modeBtn.textContent = '🔂'; }
  else if (repeatMode === 'one') { repeatMode = 'off'; modeBtn.textContent = '➡️'; }
  else { repeatMode = 'all'; modeBtn.textContent = '🔁'; }
});

shuffleBtn.addEventListener('click', () => {
  isShuffle = !isShuffle;
  shuffleBtn.classList.toggle('active', isShuffle);
});

audio.addEventListener('play', () => { isPlaying = true; updatePlayBtnUI(); });
audio.addEventListener('pause', () => { isPlaying = false; updatePlayBtnUI(); });

audio.addEventListener('ended', () => {
  if (repeatMode === 'one') {
    audio.currentTime = 0;
    audio.play();
  } else {
    const nextIdx = getNextIndex();
    if (nextIdx === -1) {
      isPlaying = false; updatePlayBtnUI();
    } else {
      loadSong(nextIdx);
    }
  }
});

// 核心同步器
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const p = audio.currentTime / audio.duration;
  progress.value = p * 1000;
  progress.style.setProperty('--p', (p * 100) + '%');
  curTime.textContent = fmtTime(audio.currentTime);
  
  // 触发歌词滚动
  syncLyrics(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  durTime.textContent = fmtTime(audio.duration);
  progress.disabled = false;
});

progress.addEventListener('input', () => {
  if (audio.duration) {
    const p = progress.value / 1000;
    progress.style.setProperty('--p', (p * 100) + '%');
    // 暂时改变显示时间，避免抖动
    curTime.textContent = fmtTime(p * audio.duration);
  }
});

progress.addEventListener('change', () => {
  if (audio.duration) {
    audio.currentTime = (progress.value / 1000) * audio.duration;
  }
});

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

// 初始化
updateTagSelect();
fetchSongs();
</script>
</body>
</html>
